<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Advanced MIS — Research Team Management System with Task Tracking, Kanban, MIS Reports, and Analytics">
    <title>Advanced MIS — Research Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <link rel="stylesheet" href="/static/css/main.css?v=3.0">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <button class="btn-icon theme-toggle-btn" id="login-theme-btn" title="Toggle Theme" style="position: absolute; top: 20px; right: 20px; z-index: 1001; font-size: 1.2rem;">
            <i class="fas fa-sun"></i>
        </button>
        <div class="login-bg-animation"></div>
        <div class="login-card glass-card">
            <div class="login-logo">
                <i class="fas fa-atom"></i>
            </div>
            <h1 class="login-title">Advanced MIS</h1>
            <p class="login-subtitle">Research Team Management Hub</p>
            <form id="login-form" class="login-form">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="text" id="login-email" placeholder="Email address" required autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-lg" id="login-btn">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                <p id="login-error" class="login-error"></p>
            </form>

        </div>
        <div style="position: absolute; bottom: 16px; font-size: 0.68rem; color: var(--text-muted); opacity: 0.35; letter-spacing: 0.5px;">
            Made by Nishant
        </div>
    </div>

    <!-- Main App Shell -->
    <div id="app-shell" class="app-shell hidden">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar Ribbon -->
            <header class="topbar">
                <div class="topbar-left">
                    <a href="#crishi" class="topbar-logo" title="MIS Dashboard">
                        <div class="logo-icon-wrap">
                            <i class="fas fa-atom"></i>
                        </div>
                        <span class="logo-text">MIS</span>
                    </a>
                    
                    <div class="topbar-separator"></div>

                    <!-- Top Ribbon Navigation -->
                    <nav class="topbar-nav" id="topbar-nav">
                        <a href="#crishi" class="nav-item active" data-page="crishi" id="nav-crishi">
                            <i class="fas fa-database"></i><span>Crishi Database</span>
                        </a>
                        <a href="#report" class="nav-item" data-page="report" id="nav-report">
                            <i class="fas fa-file-invoice"></i><span>Report</span>
                        </a>
                        <a href="#admin" class="nav-item" data-page="admin" id="nav-admin">
                            <i class="fas fa-cog"></i><span>Admin</span>
                        </a>
                    </nav>
                </div>

                <div class="topbar-right">
                    <span class="topbar-date" id="page-date"></span>
                    <h2 id="page-title" class="page-title" style="display:none">Dashboard</h2>

                    <button class="btn-icon theme-toggle-btn" id="btn-theme" title="Toggle Theme">
                        <i class="fas fa-sun"></i>
                    </button>
                    <button class="btn-icon notification-btn" id="notif-btn" title="Notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notif-badge" id="notif-badge" style="display:none">0</span>
                    </button>

                    <div class="topbar-separator"></div>

                    <!-- User Profile Chip in Top Ribbon -->
                    <button class="topbar-profile-chip" id="btn-profile" title="User Profile & Security">
                        <div class="user-avatar" id="user-avatar">V</div>
                        <div class="topbar-user-meta">
                            <span class="user-name" id="user-name">Vaibhav</span>
                            <span class="user-role-badge" id="user-role">SuperAdmin</span>
                        </div>
                        <i class="fas fa-chevron-down topbar-chevron"></i>
                    </button>
                </div>
            </header>

            <!-- Page Container -->
            <div class="page-container" id="page-container">
                <div class="loading-skeleton" id="page-loading">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Dedicated Crishi Update History Tab & View Template -->
    <template id="tmpl-crishi-history">
        <button class="crishi-tab-btn" id="tab-history"><i class="fas fa-history"></i> Update History</button>
        <div id="view-history" class="hidden"></div>
    </template>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-card glass-card" id="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Modal</h3>
                <button class="btn-icon modal-close" id="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- Submodal Overlay (Internal Popups) -->
    <div id="submodal-overlay" class="submodal-overlay hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); z-index: 600; display: flex; align-items: center; justify-content: center;">
        <div class="modal-card glass-card" id="submodal-card" style="box-shadow: 0 25px 70px rgba(0,0,0,0.6);">
            <div class="modal-header">
                <h3 id="submodal-title">Mapping Configuration</h3>
                <button class="btn-icon modal-close" id="submodal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="submodal-body"></div>
            <div class="modal-footer" id="submodal-footer"></div>
        </div>
    </div>

    <!-- Notification Panel -->
    <div id="notif-panel" class="notif-panel hidden">
        <div class="notif-header">
            <h3>Notifications</h3>
            <button class="btn btn-sm" id="notif-read-all">Mark all read</button>
        </div>
        <div class="notif-list" id="notif-list"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/static/js/app.js?v=3.2"></script>
</body>
</html>
