<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Advanced MIS — Research Team Management System with Task Tracking, Kanban, MIS Reports, and Analytics">
    <title>Advanced MIS — Research Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <link rel="stylesheet" href="/static/css/main.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <button class="btn-icon theme-toggle-btn" id="login-theme-btn" title="Toggle Theme" style="position: absolute; top: 20px; right: 20px; z-index: 1001; font-size: 1.2rem;">
            <i class="fas fa-sun"></i>
        </button>
        <div class="login-bg-animation"></div>
        <div class="login-card glass-card">
            <div class="login-logo">
                <i class="fas fa-atom"></i>
            </div>
            <h1 class="login-title">Advanced MIS</h1>
            <p class="login-subtitle">Research Team Management Hub</p>
            <form id="login-form" class="login-form">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="Email address" required autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-lg" id="login-btn">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                <p id="login-error" class="login-error"></p>
            </form>
        </div>
        <div style="position: absolute; bottom: 16px; font-size: 0.68rem; color: var(--text-muted); opacity: 0.35; letter-spacing: 0.5px;">
            Made by Nishant
        </div>
    </div>

    <!-- Main App Shell -->
    <div id="app-shell" class="app-shell hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-atom"></i>
                    <span>MIS</span>
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-page="dashboard">
                    <i class="fas fa-chart-line"></i><span>Dashboard</span>
                </a>
                <a href="#tasks" class="nav-item" data-page="tasks">
                    <i class="fas fa-tasks"></i><span>Tasks</span>
                </a>
                <a href="#kanban" class="nav-item" data-page="kanban">
                    <i class="fas fa-columns"></i><span>Kanban Board</span>
                </a>
                <a href="#chat" class="nav-item" data-page="chat">
                    <i class="fas fa-comments"></i><span>Team Chat</span>
                    <span class="badge" id="chat-badge" style="display:none">0</span>
                </a>
                <a href="#mis" class="nav-item" data-page="mis" id="nav-mis">
                    <i class="fas fa-file-pdf"></i><span>Analyze MIS Report</span>
                </a>
                <a href="#roster" class="nav-item" data-page="roster">
                    <i class="fas fa-calendar-alt"></i><span>Roster</span>
                </a>
                <div class="nav-divider"></div>
                <a href="#admin" class="nav-item" data-page="admin" id="nav-admin">
                    <i class="fas fa-cog"></i><span>Admin</span>
                </a>
            </nav>
            <div class="sidebar-user" id="sidebar-user">
                <div class="user-avatar" id="user-avatar">N</div>
                <div class="user-info">
                    <span class="user-name" id="user-name">User</span>
                    <span class="user-role" id="user-role">Role</span>
                </div>
                <button class="btn-icon" id="btn-logout" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <h2 id="page-title" class="page-title">Dashboard</h2>
                    <span class="page-date" id="page-date"></span>
                </div>
                <div class="topbar-right">
                    <button class="btn-icon theme-toggle-btn" id="btn-theme" title="Toggle Theme">
                        <i class="fas fa-sun"></i>
                    </button>
                    <button class="btn-icon notification-btn" id="notif-btn">
                        <i class="fas fa-bell"></i>
                        <span class="notif-badge" id="notif-badge" style="display:none">0</span>
                    </button>
                    <button class="btn-icon" id="btn-profile" title="Profile">
                        <i class="fas fa-user-circle"></i>
                    </button>
                </div>
            </header>

            <!-- Page Container -->
            <div class="page-container" id="page-container">
                <div class="loading-skeleton" id="page-loading">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-card glass-card" id="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Modal</h3>
                <button class="btn-icon modal-close" id="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- Notification Panel -->
    <div id="notif-panel" class="notif-panel hidden">
        <div class="notif-header">
            <h3>Notifications</h3>
            <button class="btn btn-sm" id="notif-read-all">Mark all read</button>
        </div>
        <div class="notif-list" id="notif-list"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
