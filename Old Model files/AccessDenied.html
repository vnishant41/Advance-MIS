<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MIS Tracker — Access Denied</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',system-ui,sans-serif;
      background:#0b1120;
      color:#e2e8f0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .denied-card {
      text-align:center;
      padding:48px 40px;
      max-width:440px;
      width:90%;
      background:rgba(15,23,42,0.85);
      border:1px solid rgba(148,163,184,0.08);
      border-radius:16px;
      backdrop-filter:blur(12px);
      box-shadow:0 25px 50px rgba(0,0,0,0.4);
    }
    .denied-icon {
      font-size:56px;
      margin-bottom:16px;
      display:block;
      animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.6; transform:scale(0.95); }
    }
    .denied-card h1 {
      font-size:22px;
      font-weight:700;
      color:#f87171;
      margin-bottom:8px;
      letter-spacing:-0.3px;
    }
    .denied-card p {
      font-size:14px;
      color:#94a3b8;
      line-height:1.6;
      margin-bottom:20px;
    }
    .denied-card a {
      display:inline-block;
      padding:10px 24px;
      background:linear-gradient(135deg,#2563eb,#3b82f6);
      color:#fff;
      text-decoration:none;
      border-radius:8px;
      font-size:13px;
      font-weight:600;
      transition:transform 0.15s,box-shadow 0.15s;
    }
    .denied-card a:hover {
      transform:translateY(-1px);
      box-shadow:0 4px 16px rgba(37,99,235,0.4);
    }
    .footer-note {
      margin-top:24px;
      font-size:11px;
      color:#475569;
      opacity:0.6;
    }
  </style>
</head>
<body>
  <div class="denied-card">
    <span class="denied-icon">🔒</span>
    <h1>Access Denied</h1>
    <p>Your account is not registered or has been deactivated.<br>Please contact your administrator to get access.</p>
    <a href="https://mail.google.com" target="_blank">Contact Admin</a>
    <div class="footer-note">MIS v2.0 · by Nishant</div>
  </div>
</body>
</html>
