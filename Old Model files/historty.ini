    '<div class="modal"><div class="modal-head"><h3 id="um-title">Add User</h3><button class="mclose" onclick="closeUM()">×</button></div>'+
    '<div class="modal-body">'+
    '<div class="form-group"><label>Email *</label><input type="email" id="u-email"></div>'+
    '<div class="form-group"><label>Name</label><input type="text" id="u-name"></div>'+
    '<div class="form-row"><div class="form-group"><label>Role</label><select id="u-role"><option>Teammate</option><option>Manager</option>'+(U.role==='SuperAdmin'?'<option>SuperAdmin</option>':'')+'</select></div>'+
    '<div class="form-group"><label>Department</label><input type="text" id="u-dept"></div></div>'+
