}
window.openUM=function(email){
  var m=el('u-modal');m.classList.add('open');
  if(email){
    gs('getAllUsers',[],function(err,data){
      var u=(data.data||[]).find(function(x){return x.email===email;});
      if(u){el('um-title').textContent='Edit User';el('u-edit').value=email;el('u-email').value=email;el('u-email').readOnly=true;el('u-name').value=u.name;el('u-role').value=u.role;el('u-dept').value=u.dept;el('u-active').checked=u.active;el('u-del').style.display='inline-block';}
    });
  }else{el('um-title').textContent='Add User';el('u-edit').value='';el('u-email').value='';el('u-email').readOnly=false;el('u-name').value='';el('u-role').value='Teammate';el('u-dept').value='';el('u-active').checked=true;el('u-del').style.display='none';}
};
window.closeUM=function(){el('u-modal').classList.remove('open');};
window.uSave=function(){
  var edit=el('u-edit').value,email=el('u-email').value,name=el('u-name').value,role=el('u-role').value,dept=el('u-dept').value,active=el('u-active').checked;
  if(!email){alert('Email required');return;}
  var fn=edit?'updateUser':'addUser';
  var args=edit?[email,name,role,dept,active]:[email,name,role,dept];
  gs(fn,args,function(err,res){if(res&&res.success){closeUM();loadUsers();}else alert('Error: '+(res?res.message:'Unknown'));});
};
window.uDel=function(){var email=el('u-edit').value;if(!email||!confirm('Delete '+email+'?'))return;gs('removeUser',[email],function(err,res){if(res&&res.success){closeUM();loadUsers();}else alert('Error: '+(res?res.message:'Unknown'));});};
// ══════════════════════════════════════════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════════════════════════════════════════
function loadSettings(){
  var pg=el('page-settings');
  pg.innerHTML='<div class="page-header"><div class="page-title">Settings</div></div>'+
    '<div class="page-body" id="set-body"><div style="text-align:center;padding:40px">'+spD()+' Loading...</div></div>';
  gs('getSettings',[],function(err,s){
    if(err||!s){html('set-body','<div class="empty">Error</div>');return;}
    var h='<div class="card" style="max-width:500px">'+
      '<div class="form-row"><div class="form-group"><label>Window Start</label><input type="time" id="s-ws" value="'+s.windowStart+'"></div>'+
      '<div class="form-group"><label>Window End</label><input type="time" id="s-we" value="'+s.windowEnd+'"></div></div>'+
      '<div class="form-group"><label>Manager Email (for alerts)</label><input type="email" id="s-mgr" value="'+s.managerEmail+'"></div>'+
      '<div class="form-group"><label>Escalate Days</label><input type="number" id="s-esc" value="'+s.escalateDays+'" min="1"></div>'+
      '<div class="form-group"><label><input type="checkbox" id="s-dup"'+(s.lockDuplicate?' checked':'')+' > Lock Duplicates</label></div>'+
      '<div class="form-group"><label><input type="checkbox" id="s-rem"'+(s.requireRemarks?' checked':'')+' > Require Remarks for Pending/Skip</label></div>'+
      '<button class="btn btn-primary" onclick="sSave()">Save Settings</button><div id="s-msg" class="msg-box"></div></div>';
    html('set-body',h);
  });
}
window.sSave=function(){
  var p={windowStart:el('s-ws').value,windowEnd:el('s-we').value,managerEmail:el('s-mgr').value,escalateDays:parseInt(el('s-esc').value)||3,lockDuplicate:el('s-dup').checked,requireRemarks:el('s-rem').checked};
  gs('saveSettings',[p],function(err,res){showMsg('s-msg',res&&res.success?'Saved!':'Error',res&&res.success?'ok':'err');});
};
})();
`;
}