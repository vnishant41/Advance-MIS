// ── CONSTANTS ─────────────────────────────────────────────────────────────────
var SS            = SpreadsheetApp.getActiveSpreadsheet;
var CONFIG_SHEET  = "Config";
var LOG_SHEET     = "Data Log";
var USERS_SHEET   = "Users";
var KANBAN_SHEET  = "Kanban Tasks";
var SPRINT_SHEET  = "Kanban Sprints";
var EMP_COL=2, EMP_START_ROW=3, RPT_COL=6, RPT_START_ROW=3;
var COMP_RPT_COL=10, COMP_START_ROW=3, DU_COL=16, DU_START_ROW=3;
var TASK_COL=22, TASK_START_ROW=3, SET_COL=28, SET_START_ROW=3;
var LOG_COLS=17;
var ROLES = { SUPER: "SuperAdmin", MANAGER: "Manager", TEAMMATE: "Teammate" };

// ── WEB APP ENTRY ─────────────────────────────────────────────────────────────
function doGet() {
  var user = getCurrentUser();
  if (!user) {
    return HtmlService.createHtmlOutput(
      '<html><head><meta charset="UTF-8"><style>' +
      'body{font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#1E3A5F}' +
      '.box{background:#fff;border-radius:14px;padding:48px 40px;text-align:center;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}' +
      '.icon{font-size:48px;margin-bottom:16px}h2{color:#C0392B;margin-bottom:10px;font-size:20px}' +
      'p{color:#555;font-size:13px;line-height:1.6}' +
      '</style></head><body><div class="box"><div class="icon">\uD83D\uDD12</div>' +
      '<h2>Access Denied</h2><p>Your Google account is not registered in MIS Tracker.</p>' +
      '<p style="margin-top:12px;color:#2E6DA4;font-weight:600">Contact your manager or Super Admin to get access.</p>' +
      '</div></body></html>'
    ).setTitle("MIS Tracker — Access Denied");
  }
  var html = HtmlService.createHtmlOutput(buildFullApp(user))
    .setTitle("MIS Tracker v6.0")
    .addMetaTag("viewport","width=device-width,initial-scale=1")
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
  return html;
}

// ── AUTH & USER MANAGEMENT ────────────────────────────────────────────────────
function getCurrentUser() {
  try {
    var email = Session.getActiveUser().getEmail();
    if (!email) return null;
    var sh = SS().getSheetByName(USERS_SHEET);
    if (!sh) return null;
    var rows = sh.getDataRange().getValues().slice(1);
    for (var i=0;i<rows.length;i++) {
      var r = rows[i];
      if (String(r[0]).trim().toLowerCase() === email.toLowerCase()) {
        if (String(r[4]||"YES").toUpperCase() === "NO") return null;
        return { email:r[0], name:r[1]||email.split("@")[0], role:r[2]||ROLES.TEAMMATE, dept:r[3]||"" };
      }
    }
    return null;
  } catch(e) { Logger.log("Auth error: "+e.message); return null; }
}

function getCurrentUserClient() { return getCurrentUser(); }

function canAccess(minRole) {
  var u = getCurrentUser(); if (!u) return false;
  var levels = [ROLES.TEAMMATE, ROLES.MANAGER, ROLES.SUPER];
  return levels.indexOf(u.role) >= levels.indexOf(minRole);
}

function getAllUsers() {
  if (!canAccess(ROLES.MANAGER)) return {success:false,message:"Access denied"};
  var sh = SS().getSheetByName(USERS_SHEET);
  if (!sh) return {success:true,data:[]};
  var u = getCurrentUser();
  var rows = sh.getDataRange().getValues().slice(1);
  return { success:true, data: rows.filter(function(r){
    if (!r[0]) return false;
    if (u.role === ROLES.SUPER) return true;
    return (r[3]||"") === u.dept || r[2] === ROLES.TEAMMATE;
  }).map(function(r){
    return {email:r[0],name:r[1]||"",role:r[2]||ROLES.TEAMMATE,dept:r[3]||"",active:String(r[4]||"YES").toUpperCase()!=="NO"};
  })};
}

function addUser(email, name, role, dept) {
  if (!canAccess(ROLES.MANAGER)) return {success:false,message:"Access denied"};
  var u = getCurrentUser();
  if (u.role===ROLES.MANAGER && role!==ROLES.TEAMMATE) return {success:false,message:"Managers can only add Teammates"};
  var sh = SS().getSheetByName(USERS_SHEET);
  var rows = sh.getDataRange().getValues().slice(1);
  for (var i=0;i<rows.length;i++) if(String(rows[i][0]).toLowerCase()===email.toLowerCase()) return {success:false,message:"User already exists"};
  sh.appendRow([email, name, role||ROLES.TEAMMATE, dept||u.dept||"", "YES"]);
  return {success:true};
}

function updateUser(email, name, role, dept, active) {
  if (!canAccess(ROLES.MANAGER)) return {success:false,message:"Access denied"};
  var u = getCurrentUser();
  if (u.role===ROLES.MANAGER && role===ROLES.SUPER) return {success:false,message:"Cannot promote to SuperAdmin"};
  if (u.role===ROLES.MANAGER && role===ROLES.MANAGER) return {success:false,message:"Managers cannot promote to Manager"};
  var sh = SS().getSheetByName(USERS_SHEET);
  var data = sh.getDataRange().getValues();
  for (var i=1;i<data.length;i++) {
    if (String(data[i][0]).toLowerCase()===email.toLowerCase()) {
      sh.getRange(i+1,1,1,5).setValues([[data[i][0], name||data[i][1], role||data[i][2], dept||data[i][3], active?"YES":"NO"]]);
      return {success:true};
    }
  }
  return {success:false,message:"User not found"};
}

function removeUser(email) {
  if (!canAccess(ROLES.MANAGER)) return {success:false,message:"Access denied"};
  var u = getCurrentUser();
  if (email === u.email) return {success:false,message:"Cannot remove yourself"};
  var sh = SS().getSheetByName(USERS_SHEET);
  var data = sh.getDataRange().getValues();
  for (var i=1;i<data.length;i++) {
    if (String(data[i][0]).toLowerCase()===email.toLowerCase()) {
      if (data[i][2]===ROLES.SUPER && u.role!==ROLES.SUPER) return {success:false,message:"Only SuperAdmin can remove SuperAdmin"};
      sh.deleteRow(i+1);
      return {success:true};
    }
  }
  return {success:false,message:"User not found"};
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
function getSettings() {
  try {
    var cfg = SS().getSheetByName(CONFIG_SHEET);
    var last = cfg.getLastRow();
    if (last < SET_START_ROW) return defaultSettings();
    var rows = cfg.getRange(SET_START_ROW,SET_COL,last-SET_START_ROW+1,2).getValues();
    var s = defaultSettings();
    rows.forEach(function(r){
      var k=String(r[0]).trim(), v=String(r[1]).trim(); if(!k)return;
      if(k==="Window Start")    s.windowStart=v;
      if(k==="Window End")      s.windowEnd=v;
      if(k==="Manager Email")   s.managerEmail=v;
      if(k==="Escalate Days")   s.escalateDays=parseInt(v)||3;
      if(k==="Lock Duplicate")  s.lockDuplicate=v.toUpperCase()!=="NO";
      if(k==="Require Remarks") s.requireRemarks=v.toUpperCase()!=="NO";
    });
    return s;
  } catch(e) { return defaultSettings(); }
}
function defaultSettings(){
  return{windowStart:"08:00",windowEnd:"20:00",managerEmail:"",escalateDays:3,lockDuplicate:true,requireRemarks:true};
}
function saveSettings(settings) {
  if (!canAccess(ROLES.MANAGER)) return {success:false,message:"Access denied"};
  var cfg = SS().getSheetByName(CONFIG_SHEET);
  var keys = [["Window Start",settings.windowStart],["Window End",settings.windowEnd],
    ["Manager Email",settings.managerEmail],["Escalate Days",settings.escalateDays],
    ["Lock Duplicate",settings.lockDuplicate?"YES":"NO"],["Require Remarks",settings.requireRemarks?"YES":"NO"]];
  var last = cfg.getLastRow();
  var existing = {};
  if (last >= SET_START_ROW) {
    var rows = cfg.getRange(SET_START_ROW,SET_COL,last-SET_START_ROW+1,2).getValues();
    rows.forEach(function(r,i){ if(r[0]) existing[r[0]]=SET_START_ROW+i; });
  }
  keys.forEach(function(kv){
    if (existing[kv[0]]) cfg.getRange(existing[kv[0]],SET_COL+1).setValue(kv[1]);
    else cfg.getRange(cfg.getLastRow()+1,SET_COL,1,2).setValues([[kv[0],kv[1]]]);
  });
  return {success:true};
}

function getSubmissionWindowStatus(){
  var s=getSettings(), tz=Session.getScriptTimeZone(), hhmm=Utilities.formatDate(new Date(),tz,"HH:mm");
  return{open:hhmm>=s.windowStart&&hhmm<=s.windowEnd,start:s.windowStart,end:s.windowEnd,now:hhmm};
}

// ── KANBAN ────────────────────────────────────────────────────────────────────
function getKanbanData() {
  var user = getCurrentUser(); if (!user) return {success:false};
  var sh   = SS().getSheetByName(KANBAN_SHEET);
  var spSh = SS().getSheetByName(SPRINT_SHEET);
  if (!sh) return {success:true,tasks:[],sprints:[]};
  var tz = Session.getScriptTimeZone();

  var tasks = sh.getDataRange().getValues().slice(1).filter(function(r){return r[0];}).map(function(r){
    if (user.role===ROLES.TEAMMATE && String(r[3]).toLowerCase()!==user.email.toLowerCase()) return null;
    var comments = [];
    try { comments = JSON.parse(r[14]||"[]"); } catch(e) {}
    return {
      id:String(r[0]), title:r[1]||"", desc:r[2]||"", assignedTo:r[3]||"",
      assignedToName:r[4]||r[3]||"", status:r[5]||"Assigned", priority:r[6]||"Medium",
      dueDate:r[7]?Utilities.formatDate(new Date(r[7]),tz,"yyyy-MM-dd"):"",
      createdBy:r[8]||"", createdAt:r[9]?Utilities.formatDate(new Date(r[9]),tz,"dd-MMM-yy"):"",
      updatedAt:r[10]?Utilities.formatDate(new Date(r[10]),tz,"dd-MMM-yy HH:mm"):"",
      tags:r[11]||"", sprintId:String(r[12]||""), storyPoints:parseInt(r[13])||0,
      comments:comments, dept:r[15]||""
    };
  }).filter(Boolean);

  var sprints = [];
  if (spSh) {
    sprints = spSh.getDataRange().getValues().slice(1).filter(function(r){return r[0];}).map(function(r){
      return {id:String(r[0]),name:r[1]||"",startDate:r[2]?Utilities.formatDate(new Date(r[2]),tz,"yyyy-MM-dd"):"",
              endDate:r[3]?Utilities.formatDate(new Date(r[3]),tz,"yyyy-MM-dd"):"",status:r[4]||"Active",goal:r[5]||""};
    });
  }
  return {success:true, tasks:tasks, sprints:sprints, user:user};
}

function createKanbanTask(payload) {
  if (!canAccess(ROLES.MANAGER)) return {success:false,message:"Only Managers and above can create tasks"};
  var sh = SS().getSheetByName(KANBAN_SHEET);
  if (!sh) { SS().insertSheet(KANBAN_SHEET); sh = SS().getSheetByName(KANBAN_SHEET); }
  var user = getCurrentUser();
  var now  = new Date();
  var id   = "T"+now.getTime();
  var assigneeName = resolveAssigneeName(payload.assignedTo);
  sh.appendRow([id,payload.title,payload.desc||"",payload.assignedTo,assigneeName,
    "Assigned",payload.priority||"Medium",payload.dueDate||"",user.email,now,now,
    payload.tags||"",payload.sprintId||"",payload.storyPoints||0,"[]",payload.dept||""]);
  try {
    MailApp.sendEmail({to:payload.assignedTo,subject:"New task: "+payload.title,
      body:"Hi "+assigneeName+",\n\nTask assigned: "+payload.title+"\nPriority: "+(payload.priority||"Medium")+
        "\nDue: "+(payload.dueDate||"Not set")+"\n"+(payload.desc?"\n"+payload.desc+"\n":"")+
        "\nLog in to MIS Tracker to view.\n\nMIS Tracker"});
  } catch(e) {}
  return {success:true,id:id};
}

function updateKanbanTask(payload) {
  var user = getCurrentUser(); if (!user) return {success:false};
  var sh   = SS().getSheetByName(KANBAN_SHEET);
  var data = sh.getDataRange().getValues();
  for (var i=1;i<data.length;i++) {
    if (String(data[i][0])===String(payload.id)) {
      var isOwner = String(data[i][3]).toLowerCase()===user.email.toLowerCase();
      var canEdit = canAccess(ROLES.MANAGER) || isOwner;
      if (!canEdit) return {success:false,message:"Not authorised"};
      if (user.role===ROLES.TEAMMATE) {
        sh.getRange(i+1,6).setValue(payload.status);
      } else {
        var assigneeName = resolveAssigneeName(payload.assignedTo||data[i][3]);
        sh.getRange(i+1,1,1,16).setValues([[data[i][0],payload.title||data[i][1],payload.desc||data[i][2],
          payload.assignedTo||data[i][3],assigneeName,payload.status||data[i][5],
          payload.priority||data[i][6],payload.dueDate||data[i][7],data[i][8],data[i][9],new Date(),
          payload.tags||data[i][11],payload.sprintId||data[i][12],payload.storyPoints||data[i][13],
          data[i][14]||"[]",payload.dept||data[i][15]]]);
      }
      sh.getRange(i+1,11).setValue(new Date());
      if (payload.status==="Under Review") {
        var s=getSettings();
        try { if(s.managerEmail) MailApp.sendEmail({to:s.managerEmail,subject:"Review: "+data[i][1],body:"'"+data[i][1]+"' moved to Under Review by "+user.name+"\n\nMIS Tracker"}); } catch(e){}
      }
      return {success:true};
    }
  }
  return {success:false,message:"Task not found"};
}

function deleteKanbanTask(taskId) {
  if (!canAccess(ROLES.MANAGER)) return {success:false,message:"Access denied"};
  var sh = SS().getSheetByName(KANBAN_SHEET);
  var data = sh.getDataRange().getValues();
  for (var i=1;i<data.length;i++) {
    if (String(data[i][0])===String(taskId)) { sh.deleteRow(i+1); return {success:true}; }
  }
  return {success:false,message:"Task not found"};
}

function addTaskComment(taskId, comment) {
  var user = getCurrentUser(); if (!user) return {success:false};
  var sh   = SS().getSheetByName(KANBAN_SHEET);
  var data = sh.getDataRange().getValues();
  for (var i=1;i<data.length;i++) {
    if (String(data[i][0])===String(taskId)) {
      var isOwner = String(data[i][3]).toLowerCase()===user.email.toLowerCase();
      if (!canAccess(ROLES.MANAGER) && !isOwner) return {success:false,message:"Not your task"};
      var comments = [];
      try { comments = JSON.parse(data[i][14]||"[]"); } catch(e){}
      comments.push({by:user.name,email:user.email,text:comment,at:new Date().toISOString()});
      sh.getRange(i+1,15).setValue(JSON.stringify(comments));
      sh.getRange(i+1,11).setValue(new Date());
      return {success:true};
    }
  }
  return {success:false,message:"Task not found"};
}

function createSprint(payload) {
  if (!canAccess(ROLES.MANAGER)) return {success:false,message:"Access denied"};
  var sh = SS().getSheetByName(SPRINT_SHEET);
  if (!sh) { SS().insertSheet(SPRINT_SHEET); sh = SS().getSheetByName(SPRINT_SHEET); }
  var id = "SP"+new Date().getTime();
  sh.appendRow([id,payload.name,payload.startDate,payload.endDate,"Active",payload.goal||""]);
  return {success:true,id:id};
}

function updateSprintStatus(sprintId, status) {
  if (!canAccess(ROLES.MANAGER)) return {success:false,message:"Access denied"};
  var sh   = SS().getSheetByName(SPRINT_SHEET);
  var data = sh.getDataRange().getValues();
  for (var i=1;i<data.length;i++) {
    if (String(data[i][0])===String(sprintId)) { sh.getRange(i+1,5).setValue(status); return {success:true}; }
  }
  return {success:false,message:"Sprint not found"};
}

function resolveAssigneeName(email) {
  try {
    var sh   = SS().getSheetByName(USERS_SHEET);
    var rows = sh.getDataRange().getValues().slice(1);
    for (var i=0;i<rows.length;i++) if(String(rows[i][0]).toLowerCase()===String(email||"").toLowerCase()) return rows[i][1]||email;
  } catch(e){}
  return email||"";
}

// ── DASHBOARD DATA ────────────────────────────────────────────────────────────
function getDashboardData() {
  var user = getCurrentUser(); if (!user) return {success:false};
  var log  = SS().getSheetByName(LOG_SHEET);
  var tz   = Session.getScriptTimeZone();
  var today = Utilities.formatDate(new Date(),tz,"yyyy-MM-dd");
  var rows  = log.getDataRange().getValues().slice(2);

  var myRows = rows.filter(function(r){
    if(!r[1]||r[16]==="Amended") return false;
    if (canAccess(ROLES.MANAGER)) return true;
    return String(r[12]||"").toLowerCase()===user.email.toLowerCase();
  });

  var todayRows = myRows.filter(function(r){
    return r[1] && Utilities.formatDate(new Date(r[1]),tz,"yyyy-MM-dd")===today;
  });

  var reportProgress = {};
  todayRows.forEach(function(r){
    if(r[13]!=="MISReport") return;
    var rpt = r[3];
    if(!reportProgress[rpt]) reportProgress[rpt]={name:rpt,done:0,pending:0,skip:0,late:false,employee:r[2]};
    if(r[5]==="Done") reportProgress[rpt].done++;
    else if(r[5]==="Pending") reportProgress[rpt].pending++;
    else if(r[5]==="Skip") reportProgress[rpt].skip++;
    if(r[14]==="Yes") reportProgress[rpt].late=true;
  });

  var weekTrend = {};
  for (var d=6;d>=0;d--) {
    var dd=new Date(); dd.setDate(dd.getDate()-d);
    var ds=Utilities.formatDate(dd,tz,"yyyy-MM-dd");
    weekTrend[ds]={done:0,pending:0,total:0};
  }
  myRows.forEach(function(r){
    if(!r[1]) return;
    var ds=Utilities.formatDate(new Date(r[1]),tz,"yyyy-MM-dd");
    if(weekTrend[ds]){weekTrend[ds].total++;if(r[5]==="Done")weekTrend[ds].done++;else if(r[5]==="Pending")weekTrend[ds].pending++;}
  });

  var kData = getKanbanData();
  var myKanban = (kData.tasks||[]);
  var overdue = myKanban.filter(function(t){return t.dueDate && t.dueDate<today && t.status!=="Done";});
  var dueToday = myKanban.filter(function(t){return t.dueDate===today && t.status!=="Done";});

  var pendingByReport = {};
  var reports = getReportList();
  reports.forEach(function(rpt){
    var lastData = getLastReportData(rpt.name);
    var pending = Object.keys(lastData).filter(function(k){return lastData[k].status==="Pending";});
    if(pending.length) pendingByReport[rpt.name]=pending;
  });

  return {
    success: true, user: user, today: today,
    todayStats: {
      done:   todayRows.filter(function(r){return r[5]==="Done";}).length,
      pending:todayRows.filter(function(r){return r[5]==="Pending";}).length,
      skip:   todayRows.filter(function(r){return r[5]==="Skip";}).length,
      late:   todayRows.filter(function(r){return r[14]==="Yes";}).length,
      total:  todayRows.length
    },
    reportProgress: Object.values(reportProgress),
    weekTrend: weekTrend,
    kanban: {
      total:    myKanban.length,
      open:     myKanban.filter(function(t){return t.status!=="Done";}).length,
      done:     myKanban.filter(function(t){return t.status==="Done";}).length,
      blocked:  myKanban.filter(function(t){return t.status==="Blocked";}).length,
      overdue:  overdue,
      dueToday: dueToday
    },
    pendingMIS: pendingByReport,
    recentEntries: todayRows.slice(-10).reverse().map(function(r){
      return{date:Utilities.formatDate(new Date(r[1]),tz,"dd-MMM"),employee:r[2],
        report:r[3],component:r[4],status:r[5],entryType:r[13],late:r[14]==="Yes"};
    })
  };
}

// ── TEAM DASHBOARD (Manager+) ─────────────────────────────────────────────────
function getTeamDashboard() {
  if (!canAccess(ROLES.MANAGER)) return {success:false,message:"Access denied"};
  var log   = SS().getSheetByName(LOG_SHEET);
  var tz    = Session.getScriptTimeZone();
  var today = Utilities.formatDate(new Date(),tz,"yyyy-MM-dd");
  var rows  = log.getDataRange().getValues().slice(2);
  var users = (getAllUsers().data||[]);

  var empStats = {};
  users.forEach(function(u){ empStats[u.email]={name:u.name,email:u.email,role:u.role,done:0,pending:0,skip:0,late:0,total:0,lastActive:""}; });

  rows.forEach(function(r){
    if(!r[1]||r[16]==="Amended") return;
    var ds=Utilities.formatDate(new Date(r[1]),tz,"yyyy-MM-dd");
    var em=String(r[12]||"").toLowerCase();
    var k=Object.keys(empStats).filter(function(k){return k.toLowerCase()===em;})[0];
    if(!k) return;
    if(ds===today){empStats[k].total++;if(r[5]==="Done")empStats[k].done++;else if(r[5]==="Pending")empStats[k].pending++;else if(r[5]==="Skip")empStats[k].skip++;if(r[14]==="Yes")empStats[k].late++;}
    if(!empStats[k].lastActive||ds>empStats[k].lastActive) empStats[k].lastActive=ds;
  });

  var kData = getKanbanData();
  var kanban = kData.tasks||[];
  var activeSprint = (kData.sprints||[]).filter(function(s){return s.status==="Active";})[0];
  var sprintTasks  = activeSprint ? kanban.filter(function(t){return t.sprintId===activeSprint.id;}) : [];

  return {
    success:true, today:today,
    team: Object.values(empStats),
    kanban: {
      total:   kanban.length,
      blocked: kanban.filter(function(t){return t.status==="Blocked";}),
      review:  kanban.filter(function(t){return t.status==="Under Review";}),
      overdue: kanban.filter(function(t){return t.dueDate&&t.dueDate<today&&t.status!=="Done";})
    },
    sprint: activeSprint ? {
      sprint:   activeSprint,
      total:    sprintTasks.length,
      done:     sprintTasks.filter(function(t){return t.status==="Done";}).length,
      points:   sprintTasks.reduce(function(a,t){return a+(t.storyPoints||0);},0),
      donePoints: sprintTasks.filter(function(t){return t.status==="Done";}).reduce(function(a,t){return a+(t.storyPoints||0);},0)
    } : null
  };
}

// ── MY TASK TABLE ─────────────────────────────────────────────────────────────
function getMyTaskTable() {
  var user = getCurrentUser(); if (!user) return {success:false};
  var log  = SS().getSheetByName(LOG_SHEET);
  var tz   = Session.getScriptTimeZone();
  var rows = log.getDataRange().getValues().slice(2);
  var isManager = canAccess(ROLES.MANAGER);

  var logEntries = rows.filter(function(r){
    if(!r[1]||r[16]==="Amended") return false;
    if(isManager) return true;
    return String(r[12]||"").toLowerCase()===user.email.toLowerCase();
  }).slice(-200).reverse().map(function(r){
    return{logId:r[0],date:r[1]?Utilities.formatDate(new Date(r[1]),tz,"dd-MMM-yy"):"",
      employee:r[2],report:r[3],component:r[4],status:r[5],count:r[6],remarks:r[7],
      entryType:r[13],late:r[14]==="Yes",timeTaken:r[15]||0,rowStatus:r[16]};
  });

  var kData = getKanbanData();
  var recur = getTaskList();

  return {success:true, log:logEntries, kanban:kData.tasks||[], recur:recur, user:user};
}

// ── MIS SERVER FUNCTIONS ──────────────────────────────────────────────────────
function getEmployeeList(){var cfg=SS().getSheetByName(CONFIG_SHEET);return cfg.getRange(EMP_START_ROW,EMP_COL,cfg.getLastRow()-EMP_START_ROW+1,1).getValues().map(function(r){return r[0];}).filter(Boolean);}
function getReportList(){var cfg=SS().getSheetByName(CONFIG_SHEET),last=cfg.getLastRow();if(last<RPT_START_ROW)return[];var data=cfg.getRange(RPT_START_ROW,RPT_COL,last-RPT_START_ROW+1,4).getValues(),dow=new Date().getDay();return data.filter(function(r){return r[0];}).map(function(r){var freq=String(r[3]||"Daily").trim();return{name:r[0],deadline:r[1]||"",primary:r[2]||"",frequency:freq,dueToday:isDueToday(freq,dow)};});}
function isDueToday(freq,dow){return freq==="Daily"||(freq==="Weekly"&&dow===1)||(freq==="Monthly"&&new Date().getDate()===1)||(freq==="Mon-Fri"&&dow>=1&&dow<=5)||freq==="always";}
function getReportDeadline(name){var l=getReportList();for(var i=0;i<l.length;i++)if(l[i].name===name)return l[i].deadline;return"";}
function getLastReportData(reportName){var log=SS().getSheetByName(LOG_SHEET),rows=log.getDataRange().getValues().slice(2),tz=Session.getScriptTimeZone(),res={};for(var i=rows.length-1;i>=0;i--){var r=rows[i];if(r[3]===reportName&&r[4]&&!res[r[4]]&&r[16]!=="Amended")res[r[4]]={status:r[5]||"Done",count:r[6]||0,remarks:r[7]||"",date:r[1]?Utilities.formatDate(new Date(r[1]),tz,"dd-MMM-yy"):""};}return res;}
function getComponentsForReport(reportName){var cfg=SS().getSheetByName(CONFIG_SHEET),last=cfg.getLastRow();if(last<COMP_START_ROW)return[];var data=cfg.getRange(COMP_START_ROW,COMP_RPT_COL,last-COMP_START_ROW+1,4).getValues(),prev=getLastReportData(reportName);return data.filter(function(r){return r[0]===reportName&&r[1];}).map(function(r){var p=prev[r[1]];return{name:r[1],assignee:r[2]||"",minCount:parseInt(r[3])||0,lastStatus:p?p.status:"Done",lastCount:p?p.count:0,lastRemarks:p?p.remarks:"",lastDate:p?p.date:""};});}
function getYesterdayEntries(employee,reportName){var log=SS().getSheetByName(LOG_SHEET),rows=log.getDataRange().getValues().slice(2),tz=Session.getScriptTimeZone(),yest=new Date();yest.setDate(yest.getDate()-1);while(yest.getDay()===0||yest.getDay()===6)yest.setDate(yest.getDate()-1);var yStr=Utilities.formatDate(yest,tz,"yyyy-MM-dd"),res={};rows.forEach(function(r){if(!r[1]||r[16]==="Amended")return;if(Utilities.formatDate(new Date(r[1]),tz,"yyyy-MM-dd")===yStr&&r[2]===employee&&r[3]===reportName)res[r[4]]={status:r[5],count:r[6],remarks:r[7]};});return res;}
function checkDuplicate(employee,topic,date,entryType){var s=getSettings();if(!s.lockDuplicate)return{duplicate:false};var log=SS().getSheetByName(LOG_SHEET),rows=log.getDataRange().getValues().slice(2),tz=Session.getScriptTimeZone(),ds=Utilities.formatDate(new Date(date),tz,"yyyy-MM-dd");for(var i=0;i<rows.length;i++){var r=rows[i];if(!r[1]||r[16]==="Amended")continue;if(Utilities.formatDate(new Date(r[1]),tz,"yyyy-MM-dd")===ds&&r[2]===employee&&r[3]===topic&&r[13]===entryType)return{duplicate:true,at:r[9]?Utilities.formatDate(new Date(r[9]),tz,"HH:mm"):"earlier"};}return{duplicate:false};}
function amendOld(log,employee,topic,date,entryType){var rows=log.getDataRange().getValues(),tz=Session.getScriptTimeZone(),ds=Utilities.formatDate(new Date(date),tz,"yyyy-MM-dd");for(var i=2;i<rows.length;i++){var r=rows[i];if(!r[1]||r[16]==="Amended")continue;if(Utilities.formatDate(new Date(r[1]),tz,"yyyy-MM-dd")===ds&&r[2]===employee&&r[3]===topic&&r[13]===entryType)log.getRange(i+1,17).setValue("Amended");}}
function getCommodityList(){var cfg=SS().getSheetByName(CONFIG_SHEET),last=cfg.getLastRow();if(last<DU_START_ROW)return[];var seen={};return cfg.getRange(DU_START_ROW,DU_COL,last-DU_START_ROW+1,1).getValues().map(function(r){return r[0];}).filter(function(v){if(v&&!seen[v]){seen[v]=1;return true;}return false;});}
function getTypeListForCommodity(commodity){var cfg=SS().getSheetByName(CONFIG_SHEET),last=cfg.getLastRow();if(last<DU_START_ROW)return[];var seen={};return cfg.getRange(DU_START_ROW,DU_COL,last-DU_START_ROW+1,2).getValues().filter(function(r){return r[0]===commodity&&r[1];}).map(function(r){return r[1];}).filter(function(v){if(!seen[v]){seen[v]=1;return true;}return false;});}
function getLastDUData(commodity,type){var log=SS().getSheetByName(LOG_SHEET),rows=log.getDataRange().getValues().slice(2),tz=Session.getScriptTimeZone(),res={};for(var i=rows.length-1;i>=0;i--){var r=rows[i];if(r[13]==="DataUpdate"&&r[3]===commodity&&r[4]===type&&r[5]&&!res[r[5]]&&r[16]!=="Amended")res[r[5]]={status:r[6]||"Done",remarks:r[8]||"",date:r[1]?Utilities.formatDate(new Date(r[1]),tz,"dd-MMM-yy"):""};}return res;}
function getFactorsForCommodityType(commodity,type){var cfg=SS().getSheetByName(CONFIG_SHEET),last=cfg.getLastRow();if(last<DU_START_ROW)return[];var data=cfg.getRange(DU_START_ROW,DU_COL,last-DU_START_ROW+1,5).getValues(),prev=getLastDUData(commodity,type);return data.filter(function(r){return r[0]===commodity&&r[1]===type&&r[2];}).map(function(r){var p=prev[r[2]];return{factor:r[2],mode:r[3]||"",source:r[4]||"",lastStatus:p?p.status:"Done",lastRemarks:p?p.remarks:"",lastDate:p?p.date:""};});}
function getTaskList(){var cfg=SS().getSheetByName(CONFIG_SHEET),last=cfg.getLastRow();if(last<TASK_START_ROW)return[];var data=cfg.getRange(TASK_START_ROW,TASK_COL,last-TASK_START_ROW+1,4).getValues(),dow=new Date().getDay();return data.filter(function(r){return r[0];}).map(function(r){var rec=String(r[3]||"always").trim().toLowerCase(),show=rec==="always"||rec==="daily"||(rec==="mon-fri"&&dow>=1&&dow<=5)||(rec==="weekly"&&dow===1);return{name:r[0],assignee:r[1]||"",priority:r[2]||"Medium",show:show};}).filter(function(t){return t.show;});}
function getActiveUserEmail(){try{return Session.getActiveUser().getEmail()||"";}catch(e){return "";}}
function getNextLogId(){var log=SS().getSheetByName(LOG_SHEET),lr=log.getLastRow();if(lr<3)return"LOG0001";var num=parseInt(log.getRange(lr,1).getValue().toString().replace("LOG",""),10)||0;return"LOG"+String(num+1).padStart(4,"0");}
function getWeekNumber(d){var dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-day);var yr=new Date(Date.UTC(dt.getUTCFullYear(),0,1));return Math.ceil((((dt-yr)/86400000)+1)/7);}
function styleRows(log,startRow,count){for(var r=startRow;r<startRow+count;r++){var cell=log.getRange(r,6),s=cell.getValue();cell.setBackground(s==="Done"?"#D5F5E3":s==="Pending"?"#FDEBD0":s==="Skip"?"#EAF2FF":"#FFFFFF");if(log.getRange(r,15).getValue()==="Yes")log.getRange(r,15).setBackground("#FADBD8");}}
function isLate(reportName,at){try{var dl=getReportDeadline(reportName);if(!dl)return false;return Utilities.formatDate(at,Session.getScriptTimeZone(),"HH:mm")>dl;}catch(e){return false;}}
function sendLateAlert(emp,em,report,at,mgr){try{var t=Utilities.formatDate(at,Session.getScriptTimeZone(),"HH:mm"),s="Late: "+report+" by "+emp,b="Late submission.\n\n"+emp+"\n"+report+"\n"+t+"\n\nMIS Tracker";if(em)MailApp.sendEmail({to:em,subject:s,body:b});if(mgr)MailApp.sendEmail({to:mgr,subject:s,body:b});}catch(e){}}

function submitEntries(payload){
  try{
    var s=getSettings(),log=SS().getSheetByName(LOG_SHEET),ed=new Date(payload.date),sa=new Date(),tz=Session.getScriptTimeZone();
    var wk=getWeekNumber(ed),my=Utilities.formatDate(ed,tz,"MMMM yyyy"),em=Session.getActiveUser().getEmail()||payload.email||"";
    var win=getSubmissionWindowStatus();if(!win.open)return{success:false,message:"Window closed: "+win.start+" to "+win.end+" | Now: "+win.now};
    if(s.requireRemarks){var miss=payload.entries.filter(function(e){return(e.status==="Skip"||e.status==="Pending")&&!String(e.remarks||"").trim();}).map(function(e){return e.component;});if(miss.length)return{success:false,message:"Remarks required for:\n"+miss.slice(0,5).join("\n")};}
    var cntErr=payload.entries.filter(function(e){return e.status==="Done"&&e.minCount>0&&(parseInt(e.dataCount)||0)<e.minCount;}).map(function(e){return e.component+" (min:"+e.minCount+", got:"+e.dataCount+")";});if(cntErr.length)return{success:false,message:"Count below minimum:\n"+cntErr.join("\n")};
    var dup=checkDuplicate(payload.employee,payload.report,payload.date,"MISReport");if(dup.duplicate&&!payload.forceAmend)return{success:false,duplicate:true,message:"Already submitted '"+payload.report+"' today (at "+dup.at+")."};
    if(dup.duplicate)amendOld(log,payload.employee,payload.report,payload.date,"MISReport");
    var late=isLate(payload.report,sa);if(late)sendLateAlert(payload.employee,em,payload.report,sa,s.managerEmail);
    var tt=payload.formOpenTime?Math.round((sa.getTime()-payload.formOpenTime)/60000):0,n=parseInt(getNextLogId().replace("LOG",""),10);
    var rows=payload.entries.map(function(e){return["LOG"+String(n++).padStart(4,"0"),ed,payload.employee,payload.report,e.component,e.status,e.dataCount||0,e.remarks||"",payload.backupBy||"",sa,wk,my,em,"MISReport",late?"Yes":"No",tt,"Active"];});
    if(rows.length){log.getRange(log.getLastRow()+1,1,rows.length,LOG_COLS).setValues(rows);styleRows(log,log.getLastRow()-rows.length+1,rows.length);}
    var dn=payload.entries.filter(function(e){return e.status==="Done";}).length,pd=payload.entries.filter(function(e){return e.status==="Pending";}).length,sk=payload.entries.filter(function(e){return e.status==="Skip";}).length,pct=(dn+pd)>0?Math.round(dn/(dn+pd)*100):0;
    return{success:true,message:"Saved "+rows.length+" entries!"+(late?"\nLATE (deadline: "+getReportDeadline(payload.report)+")":"")+"\nDone:"+dn+" Pending:"+pd+" Skip:"+sk+"\nProgress: "+pct+"%"};
  }catch(err){return{success:false,message:"Error: "+err.message};}
}

function submitDataUpdate(payload){
  try{
    var s=getSettings(),log=SS().getSheetByName(LOG_SHEET),ed=new Date(payload.date),sa=new Date(),tz=Session.getScriptTimeZone();
    var wk=getWeekNumber(ed),my=Utilities.formatDate(ed,tz,"MMMM yyyy"),em=Session.getActiveUser().getEmail()||payload.email||"";
    var win=getSubmissionWindowStatus();if(!win.open)return{success:false,message:"Window closed"};
    if(s.requireRemarks){var miss=payload.factors.filter(function(f){return(f.status==="Skip"||f.status==="Pending")&&!String(f.remarks||"").trim();}).map(function(f){return f.factor;});if(miss.length)return{success:false,message:"Remarks required for:\n"+miss.slice(0,5).join("\n")};}
    var topic=payload.commodity+"::"+payload.type,dup=checkDuplicate(payload.employee,topic,payload.date,"DataUpdate");if(dup.duplicate&&!payload.forceAmend)return{success:false,duplicate:true,message:"Already submitted "+payload.commodity+"/"+payload.type+" today."};if(dup.duplicate)amendOld(log,payload.employee,topic,payload.date,"DataUpdate");
    var tt=payload.formOpenTime?Math.round((sa.getTime()-payload.formOpenTime)/60000):0,n=parseInt(getNextLogId().replace("LOG",""),10);
    var rows=payload.factors.map(function(f){return["LOG"+String(n++).padStart(4,"0"),ed,payload.employee,payload.commodity,payload.type,f.factor,f.status,f.mode||"",f.remarks||"",sa,wk,my,em,"DataUpdate","No",tt,"Active"];});
    if(rows.length){log.getRange(log.getLastRow()+1,1,rows.length,LOG_COLS).setValues(rows);styleRows(log,log.getLastRow()-rows.length+1,rows.length);}
    var dn=payload.factors.filter(function(f){return f.status==="Done";}).length,pd=payload.factors.filter(function(f){return f.status==="Pending";}).length,sk=payload.factors.filter(function(f){return f.status==="Skip";}).length;
    return{success:true,message:"Saved "+rows.length+" factors!\nDone:"+dn+" Pending:"+pd+" Skip:"+sk};
  }catch(err){return{success:false,message:"Error: "+err.message};}
}

function submitTasks(payload){
  try{
    var s=getSettings(),log=SS().getSheetByName(LOG_SHEET),ed=new Date(payload.date),sa=new Date(),tz=Session.getScriptTimeZone();
    var wk=getWeekNumber(ed),my=Utilities.formatDate(ed,tz,"MMMM yyyy"),em=Session.getActiveUser().getEmail()||payload.email||"";
    var win=getSubmissionWindowStatus();if(!win.open)return{success:false,message:"Window closed"};
    var tt=payload.formOpenTime?Math.round((sa.getTime()-payload.formOpenTime)/60000):0,n=parseInt(getNextLogId().replace("LOG",""),10);
    var rows=payload.tasks.map(function(t){return["LOG"+String(n++).padStart(4,"0"),ed,payload.employee,t.name,t.priority||"Medium",t.assignee||"",t.status,"",t.remarks||"",sa,wk,my,em,"Task","No",tt,"Active"];});
    if(rows.length){log.getRange(log.getLastRow()+1,1,rows.length,LOG_COLS).setValues(rows);styleRows(log,log.getLastRow()-rows.length+1,rows.length);}
    var dn=payload.tasks.filter(function(t){return t.status==="Done";}).length,pd=payload.tasks.filter(function(t){return t.status==="Pending";}).length;
    return{success:true,message:"Saved "+rows.length+" tasks!\nDone:"+dn+" Pending:"+pd};
  }catch(err){return{success:false,message:"Error: "+err.message};}
}

// ── EMAIL TRIGGERS ────────────────────────────────────────────────────────────
function sendDailyReminder(){try{var employees=getEmployeeList(),reports=getReportList(),log=SS().getSheetByName(LOG_SHEET),rows=log.getDataRange().getValues().slice(2),tz=Session.getScriptTimeZone(),today=Utilities.formatDate(new Date(),tz,"yyyy-MM-dd"),submitted={},empEmails={};rows.forEach(function(r){if(!r[1]||r[16]==="Amended")return;if(Utilities.formatDate(new Date(r[1]),tz,"yyyy-MM-dd")===today)submitted[r[2]+"::"+r[3]]=true;if(r[2]&&r[12])empEmails[r[2]]=r[12];});employees.forEach(function(emp){var missing=reports.filter(function(rpt){return rpt.dueToday&&!submitted[emp+"::"+rpt.name];});if(!missing.length||!empEmails[emp])return;MailApp.sendEmail({to:empEmails[emp],subject:"MIS Reminder: "+missing.length+" pending",body:"Hi "+emp+",\n\nPending:\n"+missing.map(function(r){return"- "+r.name+(r.deadline?" (by "+r.deadline+")":"");}).join("\n")+"\n\nMIS Tracker"});});}catch(e){Logger.log(e);}}
function sendEODSummary(){try{var log=SS().getSheetByName(LOG_SHEET),rows=log.getDataRange().getValues().slice(2),tz=Session.getScriptTimeZone(),today=Utilities.formatDate(new Date(),tz,"yyyy-MM-dd"),emp={};rows.forEach(function(r){if(!r[1]||r[16]==="Amended"||Utilities.formatDate(new Date(r[1]),tz,"yyyy-MM-dd")!==today)return;var e=r[2];if(!emp[e])emp[e]={done:0,pending:0,skip:0,email:r[12]};if(r[5]==="Done")emp[e].done++;else if(r[5]==="Pending")emp[e].pending++;else if(r[5]==="Skip")emp[e].skip++;});Object.keys(emp).forEach(function(e){var d=emp[e];if(!d.email)return;var act=d.done+d.pending,pct=act>0?Math.round(d.done/act*100):0;MailApp.sendEmail({to:d.email,subject:"MIS EOD: "+pct+"% complete",body:"Hi "+e+",\n\nDone: "+d.done+"\nPending: "+d.pending+"\nSkip: "+d.skip+"\n"+pct+"%\n\nMIS Tracker"});});}catch(e){Logger.log(e);}}
function checkPendingEscalation(){try{var s=getSettings();if(!s.managerEmail)return;var log=SS().getSheetByName(LOG_SHEET),rows=log.getDataRange().getValues().slice(2),tz=Session.getScriptTimeZone(),cutoff=new Date();cutoff.setDate(cutoff.getDate()-s.escalateDays);var counts={};rows.forEach(function(r){if(!r[1]||r[5]!=="Pending"||r[16]==="Amended"||new Date(r[1])<cutoff)return;var k=r[2]+"::"+r[4];counts[k]=(counts[k]||0)+1;});var alerts=Object.keys(counts).filter(function(k){return counts[k]>=s.escalateDays;});if(!alerts.length)return;MailApp.sendEmail({to:s.managerEmail,subject:"MIS Escalation",body:"Pending "+s.escalateDays+"+ days:\n\n"+alerts.map(function(k){return"- "+k+" ("+counts[k]+" days)";}).join("\n")+"\n\nMIS Tracker"});}catch(e){Logger.log(e);}}

function setupTriggers(){
  ScriptApp.getProjectTriggers().forEach(function(t){var fn=t.getHandlerFunction();if(["sendDailyReminder","sendEODSummary","checkPendingEscalation"].indexOf(fn)>-1)ScriptApp.deleteTrigger(t);});
  ScriptApp.newTrigger("sendDailyReminder").timeBased().atHour(9).everyDays(1).create();
  ScriptApp.newTrigger("sendEODSummary").timeBased().atHour(18).everyDays(1).create();
  ScriptApp.newTrigger("checkPendingEscalation").timeBased().atHour(8).everyDays(1).create();
  SpreadsheetApp.getUi().alert("Triggers set: Reminder 9AM | EOD 6PM | Escalation 8AM");
}

function exportTodayCSV(){var log=SS().getSheetByName(LOG_SHEET),data=log.getDataRange().getValues(),today=Utilities.formatDate(new Date(),Session.getScriptTimeZone(),"yyyy-MM-dd"),rows=data.slice(2).filter(function(r){return r[1]&&Utilities.formatDate(new Date(r[1]),Session.getScriptTimeZone(),"yyyy-MM-dd")===today;});if(!rows.length){SpreadsheetApp.getUi().alert("No entries today.");return;}var csv=data[1].join(",")+"\n";rows.forEach(function(r){csv+=r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(",")+"\n";});var file=DriveApp.getRootFolder().createFile("MIS_Export_"+today+".csv",csv,MimeType.CSV);SpreadsheetApp.getUi().alert("Saved: "+file.getName());}

function getInitialFormData(){return{employees:getEmployeeList(),reports:getReportList(),windowStatus:getSubmissionWindowStatus(),email:getActiveUserEmail(),today:Utilities.formatDate(new Date(),Session.getScriptTimeZone(),"yyyy-MM-dd"),settings:getSettings()};}

function onOpen(){SpreadsheetApp.getUi().createMenu("MIS Tracker").addItem("Open App","openWebApp").addSeparator().addItem("Setup Triggers","setupTriggers").addItem("Export Today CSV","exportTodayCSV").addToUi();}
