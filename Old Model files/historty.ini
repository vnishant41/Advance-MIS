}
window.duComm=function(){gs('getCommodityList',[],function(err,c){if(err||!c)return;var s=el('du-comm');s.innerHTML='<option value="">-- Select --</option>'+c.map(function(x){return'<option>'+x+'</option>';}).join('');});};
window.duTypes=function(){var c=el('du-comm').value;if(!c){el('du-type-row').style.display='none';return;}gs('getTypeListForCommodity',[c],function(err,ts){if(err||!ts)return;el('du-type').innerHTML=ts.map(function(t){return'<option>'+t+'</option>';}).join('');el('du-type-row').style.display='block';duFactors();});};
window.duFactors=function(){var c=el('du-comm').value,t=el('du-type').value;if(!c||!t)return;var area=el('du-fac');area.innerHTML=spD()+' Loading...';_misFormOpenTime=Date.now();
  gs('getFactorsForCommodityType',[c,t],function(err,fs){
    if(err||!fs){area.innerHTML='<div class="empty">Error</div>';return;}
    if(!fs.length){area.innerHTML='<div class="empty">No factors</div>';return;}
    var h='<div class="item-section"><div class="item-head"><span>Factors <span class="item-count-badge">'+fs.length+'</span></span>'+
      '<div style="display:flex;gap:5px"><button class="bb" onclick="duBulk(\\'Done\\')">All Done</button><button class="bb" onclick="duBulk(\\'Pending\\')">Pending</button><button class="bb" onclick="duBulk(\\'Skip\\')">Skip</button></div></div><div class="items-list">';
    fs.forEach(function(f,i){h+='<div class="irow"><div class="irow-name">'+f.factor+(f.mode?'<span class="imeta">'+f.mode+'</span>':'')+(f.lastDate?'<span class="ld">'+f.lastStatus+' '+f.lastDate+'</span>':'')+'</div>'+
      '<div class="fac-grid"><select class="ss '+(f.lastStatus||'done').toLowerCase()+'" id="df-'+i+'" onchange="this.className=\\'ss \\'+this.value.toLowerCase()">'+
      '<option'+(f.lastStatus==='Done'?' selected':'')+'>Done</option><option'+(f.lastStatus==='Pending'?' selected':'')+'>Pending</option><option'+(f.lastStatus==='Skip'?' selected':'')+'>Skip</option></select>'+
      '<input class="ni" type="text" id="dr-'+i+'" value="'+f.lastRemarks+'" placeholder="Remarks..."></div></div>';});
    h+='</div></div><input type="hidden" id="df-cnt" value="'+fs.length+'">'+
      '<button class="sub-btn" style="margin-top:12px" onclick="duSub(false)">Submit Data Update</button>';
    window._duFs=fs;area.innerHTML=h;
  });
};
window.duBulk=function(s){var n=parseInt((el('df-cnt')||{}).value||0);for(var i=0;i<n;i++){var sel=el('df-'+i);if(sel){sel.value=s;sel.className='ss '+s.toLowerCase();}}};
window.duSub=function(force){
  var fs=window._duFs||[];
  var p={employee:el('du-emp').value,commodity:el('du-comm').value,type:el('du-type').value,date:el('du-date').value,formOpenTime:_misFormOpenTime,forceAmend:!!force,
    factors:fs.map(function(f,i){return{factor:f.factor,status:(el('df-'+i)||{}).value||'Done',mode:f.mode||'',remarks:(el('dr-'+i)||{}).value||''};})
  };
  gs('submitDataUpdate',[p],function(err,res){
    if(err||!res){showMsg('du-msg','Error','err');return;}
    if(res.duplicate){var dup=el('du-dup');dup.style.display='block';dup.innerHTML=res.message+'<br><button class="db db-ok" onclick="duSub(true)">Overwrite</button><button class="db db-no" onclick="el(\\'du-dup\\').style.display=\\'none\\'">Cancel</button>';return;}
    showMsg('du-msg',res.message,res.success?'ok':'err');
  });
};
// Tasks Panel
function rTaskPanel(d){
  var h='<div class="sess-bar">'+
    '<div><span class="sess-label">Date</span><input type="date" id="tk-date" value="'+d.today+'"></div>'+
    '<div><span class="sess-label">Employee</span><select id="tk-emp">'+(d.employees||[]).map(function(e){return'<option>'+e+'</option>';}).join('')+'</select></div>'+
    '<div style="display:flex;align-items:flex-end"><button class="load-btn" style="margin:0" onclick="tkLoad()">Load Tasks</button></div></div>'+
    '<div id="tk-area"></div><div id="tk-msg" class="msg-box"></div>';
  html('mp-2',h);
}
window.tkLoad=function(){
  var area=el('tk-area');area.innerHTML=spD()+' Loading...';_misFormOpenTime=Date.now();
  gs('getTaskList',[],function(err,tasks){
    if(err||!tasks){area.innerHTML='<div class="empty">Error</div>';return;}
    if(!tasks.length){area.innerHTML='<div class="empty">No tasks configured for today</div>';return;}
    var h='<div class="item-section"><div class="item-head"><span>Tasks <span class="item-count-badge">'+tasks.length+'</span></span></div><div class="items-list">';
    tasks.forEach(function(t,i){h+='<div class="irow"><div class="irow-name">'+ pDot(t.priority)+' '+t.name+(t.assignee?'<span class="imeta">'+t.assignee+'</span>':'')+ '</div>'+
      '<div class="tsk-grid">'+
      '<select class="ss done" id="ts-'+i+'" onchange="this.className=\\'ss \\'+this.value.toLowerCase()"><option>Done</option><option>Pending</option><option>Skip</option></select>'+
      '<select class="psel medium" id="tp-'+i+'" onchange="this.className=\\'psel \\'+this.value.toLowerCase()"><option>High</option><option selected>Medium</option><option>Low</option></select>'+
      '<input class="ni" type="text" id="trem-'+i+'" placeholder="Remarks...">'+
      '</div></div>';});
    h+='</div></div><input type="hidden" id="tk-cnt" value="'+tasks.length+'">'+
      '<button class="sub-btn" style="margin-top:12px" onclick="tkSub()">Submit Tasks</button>';
    window._tkTasks=tasks;area.innerHTML=h;
  });
};
window.tkSub=function(){
  var ts=window._tkTasks||[];
  var p={employee:el('tk-emp').value,date:el('tk-date').value,formOpenTime:_misFormOpenTime,
    tasks:ts.map(function(t,i){return{name:t.name,assignee:t.assignee||'',priority:(el('tp-'+i)||{}).value||'Medium',status:(el('ts-'+i)||{}).value||'Done',remarks:(el('trem-'+i)||{}).value||''};})};
  gs('submitTasks',[p],function(err,res){
    if(err||!res){showMsg('tk-msg','Error','err');return;}
    showMsg('tk-msg',res.message,res.success?'ok':'err');
    if(res.success){window._tkTasks=null;html('tk-area','');}
  });
};
// ══════════════════════════════════════════════════════════════════════════════
// KANBAN
// ══════════════════════════════════════════════════════════════════════════════
var _kb={tasks:[],sprints:[],filter:'all',sprint:'all',search:''};
var _drag=null;
function loadKanban(){
  var pg=el('page-kanban');
  pg.innerHTML='<div class="page-header"><div class="page-title">Kanban Board</div>'+(canMgr()?'<button class="btn btn-primary btn-sm" onclick="openTM()">+ New Task</button>':'')+'</div>'+
    '<div class="page-body" id="kb-body"><div style="text-align:center;padding:40px">'+spD()+' Loading...</div></div>';
  gs('getKanbanData',[],function(err,data){
    if(err||!data){html('kb-body','<div class="empty">Error loading kanban</div>');return;}
    _kb.tasks=data.tasks||[];_kb.sprints=data.sprints||[];
    renderKB();
  });
}
function renderKB(){
  var aSp=_kb.sprints.filter(function(s){return s.status==='Active';})[0];
  var flt='<div class="k-filters">'+
    '<input type="text" placeholder="Search..." style="padding:5px 10px;border:1.5px solid var(--border);border-radius:20px;font-size:11px;width:160px" oninput="_kb.search=this.value;renderKB()" value="'+(_kb.search||'')+'">'+
    ['all','High','Medium','Low'].map(function(f){return'<span class="k-filter-chip'+(_kb.filter===f?' active':'')+'" onclick="_kb.filter=\\''+f+'\\';renderKB()">'+f+'</span>';}).join('')+'</div>';
  if(aSp){flt+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="sprint-badge">'+aSp.name+'</span><span style="font-size:11px;color:var(--muted)">'+aSp.startDate+' to '+aSp.endDate+'</span>'+
    '<span class="k-filter-chip'+(_kb.sprint===aSp.id?' active':'')+'" onclick="_kb.sprint=_kb.sprint===\\''+aSp.id+'\\'?\\'all\\':\\''+aSp.id+'\\';renderKB()">Sprint only</span></div>';}
  var cols=[{id:'Assigned',label:'Assigned',cls:'k-assigned'},{id:'In Progress',label:'In Progress',cls:'k-inprogress'},
    {id:'Under Review',label:'Review',cls:'k-review'},{id:'Done',label:'Done',cls:'k-done'},{id:'Blocked',label:'Blocked',cls:'k-blocked'}];
  var tasks=_kb.tasks.filter(function(t){
    if(_kb.filter!=='all'&&t.priority!==_kb.filter)return false;
    if(_kb.sprint!=='all'&&t.sprintId!==_kb.sprint)return false;
    if(_kb.search&&t.title.toLowerCase().indexOf(_kb.search.toLowerCase())<0)return false;
    return true;});
  var board='<div class="kanban-wrap"><div class="kanban-board">';
  cols.forEach(function(col){
    var cT=tasks.filter(function(t){return t.status===col.id;});
    board+='<div class="k-col '+col.cls+'" ondragover="kOver(event,\\''+col.id+'\\')" ondrop="kDrop(event,\\''+col.id+'\\')" ondragleave="kLeave(event)">'+
      '<div class="k-col-header"><span class="k-col-title">'+col.label+'</span><span class="k-col-count">'+cT.length+'</span></div>'+
      '<div class="k-col-body">';
    cT.forEach(function(t){board+=kCard(t);});
    board+='</div></div>';
  });
  board+='</div></div>';
  html('kb-body',flt+board);
  if(!el('t-modal')){var m=document.createElement('div');m.innerHTML=tModalHTML();document.body.appendChild(m.firstChild);}
}
function kCard(t){
  var dCls=!t.dueDate?'':(t.dueDate<TODAY?'overdue':t.dueDate===TODAY?'soon':'ok');
  var dLbl=t.dueDate?(t.dueDate<TODAY?'Overdue':t.dueDate===TODAY?'Due Today':'Due '+t.dueDate):'';
  var tags=t.tags?t.tags.split(',').map(function(g){return'<span class="k-tag">'+g.trim()+'</span>';}).join(''):'';
  var cCnt=t.comments?t.comments.length:0;
  var canD=canMgr()||(U.email===t.assignedTo);
  var sOpts=['Assigned','In Progress','Under Review','Done','Blocked'].map(function(s){return'<option'+(s===t.status?' selected':'')+'>'+s+'</option>';}).join('');
  return '<div class="k-card" draggable="'+(canD?'true':'false')+'" ondragstart="kStart(event,\\''+t.id+'\\')" ondragend="kEnd(event)">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">'+ pDot(t.priority)+'<span class="k-card-title" style="flex:1;margin:0 6px">'+t.title+'</span>'+(t.storyPoints?'<span class="k-points">'+t.storyPoints+'sp</span>':'')+'</div>'+
    (t.desc?'<div class="k-card-desc">'+t.desc+'</div>':'')+
    (tags?'<div class="k-card-meta">'+tags+'</div>':'')+
    (dLbl?'<div class="k-due '+dCls+'">'+dLbl+'</div>':'')+
    '<div class="k-card-footer">'+
    '<div class="k-assignee"><div class="k-mini-avatar">'+(t.assignedToName||t.assignedTo||'?').charAt(0).toUpperCase()+'</div>'+
    (t.assignedToName||t.assignedTo||'Unassigned')+'</div>'+(cCnt?'<span style="font-size:10px;color:var(--muted)">💬'+cCnt+'</span>':'')+'</div>'+
    '<div class="k-card-actions">'+(canMgr()||U.email===t.assignedTo?'<select style="flex:1;padding:2px 4px;font-size:10px;border:1px solid var(--border);border-radius:4px" onchange="kStat(\\''+t.id+'\\',this.value)">'+sOpts+'</select>':'')+
    '<button class="k-action" onclick="openCmts(\\''+t.id+'\\')">💬</button>'+(canMgr()?'<button class="k-action" onclick="openTM(\\''+t.id+'\\')">✏️</button>':'')+
    (canMgr()?'<button class="k-action" onclick="kDel(\\''+t.id+'\\')" style="color:#ef4444">🗑️</button>':'')+
    '</div></div>';
}
window.kStart=function(e,id){_drag=id;e.currentTarget.classList.add('dragging');e.dataTransfer.setData('text/plain',id);};
window.kEnd=function(e){e.currentTarget.classList.remove('dragging');_drag=null;};
window.kOver=function(e){e.preventDefault();e.currentTarget.classList.add('drag-over');};
window.kLeave=function(e){e.currentTarget.classList.remove('drag-over');};
window.kDrop=function(e,status){e.preventDefault();e.currentTarget.classList.remove('drag-over');var id=e.dataTransfer.getData('text/plain')||_drag;if(!id)return;gs('updateKanbanTask',[{id:id,status:status}],function(err,res){if(res&&res.success){var t=_kb.tasks.find(function(t){return t.id===id;});if(t)t.status=status;renderKB();}else alert('Error: '+(res?res.message:'Unknown'));});};
window.kStat=function(id,status){gs('updateKanbanTask',[{id:id,status:status}],function(err,res){if(res&&res.success){var t=_kb.tasks.find(function(t){return t.id===id;});if(t)t.status=status;renderKB();}});};
window.kDel=function(id){if(!confirm('Delete this task?'))return;gs('deleteKanbanTask',[id],function(err,res){if(res&&res.success){_kb.tasks=_kb.tasks.filter(function(t){return t.id!==id;});renderKB();}});};
// Task Modal
function tModalHTML(){
  return '<div class="modal-bg" id="t-modal" onclick="if(event.target===this)closeTM()">'+
    '<div class="modal modal-lg"><div class="modal-head"><h3 id="tm-title">New Task</h3><button class="mclose" onclick="closeTM()">×</button></div>'+
    '<div class="modal-body">'+
    '<div class="form-row"><div class="form-group"><label>Title *</label><input type="text" id="t-ttl"></div>'+
    '<div class="form-group"><label>Priority</label><select id="t-pri"><option>High</option><option selected>Medium</option><option>Low</option></select></div></div>'+
    '<div class="form-group"><label>Description</label><textarea id="t-dsc"></textarea></div>'+
    '<div class="form-row"><div class="form-group"><label>Assign To (email)</label><input type="email" id="t-asgn"></div>'+
    '<div class="form-group"><label>Due Date</label><input type="date" id="t-due"></div></div>'+
    '<div class="form-row"><div class="form-group"><label>Story Points</label><input type="number" id="t-pts" min="0" value="0"></div>'+
    '<div class="form-group"><label>Sprint</label><select id="t-sp"><option value="">No Sprint</option></select></div></div>'+
    '<div class="form-row"><div class="form-group"><label>Tags</label><input type="text" id="t-tags" placeholder="comma separated"></div>'+
    '<div class="form-group"><label>Department</label><input type="text" id="t-dept"></div></div>'+
    '<input type="hidden" id="t-id"></div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeTM()">Cancel</button>'+
    '<button class="btn btn-primary" id="t-save" onclick="tSave()">Save Task</button></div></div></div>';
}
window.openTM=function(id){
  var m=el('t-modal');m.classList.add('open');
  var spSel=el('t-sp');spSel.innerHTML='<option value="">No Sprint</option>'+_kb.sprints.map(function(s){return'<option value="'+s.id+'">'+s.name+'</option>';}).join('');
  if(id){
    var t=_kb.tasks.find(function(x){return x.id===id;});
    if(t){el('tm-title').textContent='Edit Task';el('t-id').value=t.id;el('t-ttl').value=t.title;el('t-dsc').value=t.desc||'';el('t-asgn').value=t.assignedTo||'';el('t-due').value=t.dueDate||'';el('t-pri').value=t.priority||'Medium';el('t-pts').value=t.storyPoints||0;el('t-sp').value=t.sprintId||'';el('t-tags').value=t.tags||'';el('t-dept').value=t.dept||'';}
  }else{el('tm-title').textContent='New Task';el('t-id').value='';el('t-ttl').value='';el('t-dsc').value='';el('t-asgn').value='';el('t-due').value='';el('t-pri').value='Medium';el('t-pts').value='0';el('t-sp').value='';el('t-tags').value='';el('t-dept').value='';}
};
window.closeTM=function(){el('t-modal').classList.remove('open');};
window.tSave=function(){
  var id=el('t-id').value,ttl=el('t-ttl').value;if(!ttl){alert('Title required');return;}
  var p={id:id||null,title:ttl,desc:el('t-dsc').value,assignedTo:el('t-asgn').value,dueDate:el('t-due').value,priority:el('t-pri').value,storyPoints:parseInt(el('t-pts').value)||0,sprintId:el('t-sp').value,tags:el('t-tags').value,dept:el('t-dept').value};
  var btn=el('t-save');btn.disabled=true;btn.innerHTML=sp()+' Saving...';
  var fn=id?'updateKanbanTask':'createKanbanTask';
  gs(fn,[p],function(err,res){btn.disabled=false;btn.textContent='Save Task';if(err||!res||!res.success){alert('Error: '+(res?res.message:'Unknown'));return;}closeTM();loadKanban();});
};
// Comments Modal
window.openCmts=function(id){
  var t=_kb.tasks.find(function(x){return x.id===id;});if(!t)return;
  var cmts=(t.comments||[]).map(function(c){return'<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div style="font-size:11px;font-weight:700">'+c.by+'</div><div style="font-size:10px;color:var(--muted)">'+new Date(c.at).toLocaleString()+'</div><div style="font-size:12px;margin-top:4px">'+c.text+'</div></div>';}).join('')||'<div class="empty">No comments yet</div>';
  var h='<div class="modal-bg open" id="cmt-modal" onclick="if(event.target===this)closeCmts()">'+
    '<div class="modal"><div class="modal-head"><h3>Comments: '+t.title+'</h3><button class="mclose" onclick="closeCmts()">×</button></div>'+
    '<div class="modal-body"><div style="max-height:200px;overflow-y:auto">'+cmts+'</div>'+
    '<div class="form-group" style="margin-top:12px"><label>Add Comment</label><textarea id="cmt-txt"></textarea></div></div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeCmts()">Close</button>'+
    '<button class="btn btn-primary" onclick="addCmt(\\''+id+'\\')">Add Comment</button></div></div></div>';
  var div=document.createElement('div');div.innerHTML=h;document.body.appendChild(div.firstChild);
};
window.closeCmts=function(){var m=el('cmt-modal');if(m)m.remove();};
window.addCmt=function(id){var txt=(el('cmt-txt')||{}).value;if(!txt){alert('Enter comment');return;}gs('addTaskComment',[id,txt],function(err,res){if(res&&res.success){closeCmts();loadKanban();}else alert('Error');});};
