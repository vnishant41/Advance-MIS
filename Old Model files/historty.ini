    '.sidebar{transform:translateX(-240px)}.sidebar.open{transform:translateX(0)}',
    '.main-content{margin-left:0}',
    '.page-body{padding:12px 14px}',
    '.comp-grid{grid-template-columns:1fr 55px 1fr}',
    '.tsk-grid{grid-template-columns:1fr 1fr}',
    '.form-row{grid-template-columns:1fr}',
    '.stats-grid{grid-template-columns:1fr 1fr}',
    '.sess-bar{grid-template-columns:1fr}',
    '.kanban-board{min-width:auto;flex-direction:column}',
    '.k-col{width:100%}',
    '}'
  ];
  return lines.join('\n');
}

function getAppJS() {
  return `
(function(){
var U=__INIT__.user;
var TODAY=__INIT__.today;
var _misFormOpenTime=null;
// ── Helper: call server ──
function gs(fn,args,cb){
  google.script.run
    .withSuccessHandler(function(r){cb(null,r);})
    .withFailureHandler(function(e){cb(e,null);})
    [fn].apply(null,Array.isArray(args)?args:[args]);
}
// ── Init ──
document.addEventListener('DOMContentLoaded',function(){renderSidebar();navigate('dashboard');});
// ── Sidebar ──
function renderSidebar(){
  var root=document.getElementById('app-root');
  var isM=U.role==='Manager'||U.role==='SuperAdmin';
  var menu=[
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'mis',icon:'📋',label:'MIS Entry'},
    {id:'kanban',icon:'🗂',label:'Kanban Board'},
    {id:'mytasks',icon:'✅',label:'My Tasks'}
  ];
  if(isM){
    menu.push({id:'team',icon:'👥',label:'Team Dashboard'});
    menu.push({id:'users',icon:'👤',label:'Users'});
    menu.push({id:'settings',icon:'⚙',label:'Settings'});
  }
  var rCls=U.role==='SuperAdmin'?'role-super':U.role==='Manager'?'role-manager':'role-teammate';
  var pages=['dashboard','mis','kanban','mytasks','team','users','settings'];
  root.innerHTML=
    '<button class="mob-btn" onclick="toggleSidebar()">☰</button>'+
    '<div class="app-wrap">'+
    '<nav class="sidebar" id="sidebar">'+
    '<div class="sb-brand"><h1>MIS Tracker</h1><p>v6.0</p></div>'+
    '<div class="sb-user"><div class="sb-avatar">'+U.name.charAt(0).toUpperCase()+'</div>'+
    '<div><div class="sb-name">'+U.name+'</div><span class="role-badge '+rCls+'">'+U.role+'</span></div></div>'+
    '<div class="sb-menu" id="sb-menu">'+
    menu.map(function(m){return'<button class="sb-item" id="sb-'+m.id+'" onclick="navigate(\\''+m.id+'\\')">'+
      '<span class="si">'+m.icon+'</span>'+m.label+'</button>';}).join('')+
    '</div><div class="sb-footer">MIS Tracker v6.0</div></nav>'+
    '<div class="main-content" id="main-content">'+
    pages.map(function(p){return'<div id="page-'+p+'" class="page"></div>';}).join('')+
    '</div></div>';
}
window.toggleSidebar=function(){document.getElementById('sidebar').classList.toggle('open');};
window.navigate=function(page){
  document.querySelectorAll('.sb-item').forEach(function(e){e.classList.remove('active');});
  var sb=document.getElementById('sb-'+page);if(sb)sb.classList.add('active');
  document.querySelectorAll('.page').forEach(function(e){e.classList.remove('active');});
  var pg=document.getElementById('page-'+page);if(pg)pg.classList.add('active');
  var s=document.getElementById('sidebar');if(s)s.classList.remove('open');
  switch(page){
    case'dashboard':loadDashboard();break;
    case'mis':loadMIS();break;
    case'kanban':loadKanban();break;
    case'mytasks':loadMyTasks();break;
    case'team':loadTeam();break;
    case'users':loadUsers();break;
    case'settings':loadSettings();break;
  }
};
// ── Helpers ──
function el(id){return document.getElementById(id);}
function html(id,h){var e=el(id);if(e)e.innerHTML=h;}
function sp(){return'<span class="spinner"></span>';}
function spD(){return'<span class="spinner spinner-dark"></span>';}
function rBadge(r){var c=r==='SuperAdmin'?'b-super':r==='Manager'?'b-manager':'b-teammate';return'<span class="badge '+c+'">'+r+'</span>';}
function sBadge(s){var m={Done:'b-done',Pending:'b-pending',Skip:'b-skip',Assigned:'b-assigned','In Progress':'b-inprog','Under Review':'b-review',Blocked:'b-blocked'};return'<span class="badge '+(m[s]||'')+'">'+s+'</span>';}
function pDot(p){return'<span class="pri pri-'+(p||'medium').toLowerCase()+'"></span>';}
function isOver(d){return d&&d<TODAY;}
function isToday(d){return d===TODAY;}
function canMgr(){return U.role==='Manager'||U.role==='SuperAdmin';}
function showMsg(id,msg,type,hide){var e=el(id);if(!e)return;if(hide){e.style.display='none';e.textContent='';return;}e.textContent=msg;e.className='msg-box msg-'+(type==='ok'?'ok':'err');e.style.display='block';e.scrollIntoView({behavior:'smooth',block:'nearest'});}
// ══════════════════════════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════════════════════════
function loadDashboard(){
  var pg=el('page-dashboard');
  pg.innerHTML='<div class="page-header"><div><div class="page-title">Dashboard</div><div class="page-sub">'+TODAY+'</div></div></div>'+
    '<div class="page-body" id="db-body"><div style="text-align:center;padding:40px">'+spD()+' Loading...</div></div>';
  gs('getDashboardData',[],function(err,data){
    if(err||!data||!data.success){html('db-body','<div class="empty"><div class="empty-icon">⚠️</div>Error loading dashboard</div>');return;}
    var body='';
    // Overdue tasks alert
    if(data.kanban&&data.kanban.overdue&&data.kanban.overdue.length){
      body+='<div class="overdue-card"><div class="overdue-title">⚠️ Overdue Tasks ('+data.kanban.overdue.length+')</div>';
      data.kanban.overdue.slice(0,5).forEach(function(t){body+='<div class="overdue-item"><span>'+t.title+'</span><span>Due: '+t.dueDate+'</span></div>';});
      body+='</div>';
    }
    // Stats
    var s=data.todayStats||{};
    var tot=(s.done||0)+(s.pending||0)+(s.skip||0);
    var pct=(s.done+s.pending)>0?Math.round(s.done/(s.done+s.pending)*100):0;
    body+='<div class="stats-grid">';
    body+='<div class="stat stat-done"><div class="stat-label">Done Today</div><div class="stat-value">'+s.done+'</div><div class="stat-sub">of '+tot+' entries</div></div>';
    body+='<div class="stat stat-pend"><div class="stat-label">Pending</div><div class="stat-value">'+s.pending+'</div></div>';
    body+='<div class="stat stat-late"><div class="stat-label">Late</div><div class="stat-value">'+s.late+'</div></div>';
    body+='<div class="stat stat-kanban"><div class="stat-label">Open Tasks</div><div class="stat-value">'+((data.kanban||{}).open||0)+'</div><div class="stat-sub">'+(data.kanban?(data.kanban.blocked||0):0)+' blocked</div></div>';
    body+='</div>';
    // Progress ring + trend
    var r2=36,circ=2*Math.PI*r2,dash=(pct/100)*circ;
    body+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">';
    body+='<div class="card"><div class="card-header"><span class="card-title">Today Progress</span></div>'+
      '<div style="display:flex;align-items:center;gap:16px;padding:4px 0">'+
      '<div class="ring-wrap"><svg width="80" height="80" viewBox="0 0 80 80">'+
      '<circle cx="40" cy="40" r="'+r2+'" fill="none" stroke="#f1f5f9" stroke-width="8"/>'+
      '<circle cx="40" cy="40" r="'+r2+'" fill="none" stroke="#17A589" stroke-width="8" stroke-dasharray="'+dash.toFixed(1)+' '+circ.toFixed(1)+'" stroke-linecap="round"/>'+
      '</svg><div class="ring-text"><div class="ring-pct">'+pct+'%</div><div class="ring-lbl">Done</div></div></div>'+
      '<div><div style="font-size:13px;font-weight:700;margin-bottom:8px">'+data.user.name+'</div>'+
      '<div style="font-size:11px;color:var(--muted)">'+s.done+' Done</div>'+
      '<div style="font-size:11px;color:var(--muted)">'+s.pending+' Pending</div>'+
      '<div style="font-size:11px;color:var(--muted)">'+s.skip+' Skip</div></div></div></div>';
    // Weekly trend
    var wk=data.weekTrend||{};var days=Object.keys(wk).sort();
    var maxT=Math.max.apply(null,days.map(function(d){return wk[d].total||1;}));
    body+='<div class="card"><div class="card-header"><span class="card-title">7-Day Trend</span></div><div class="trend-wrap">';
    days.forEach(function(d){var day=wk[d];var h=maxT>0?Math.round((day.done/maxT)*44):2;var lbl=new Date(d).toLocaleDateString('en-IN',{weekday:'short'}).substring(0,2);
      body+='<div class="trend-bar-wrap"><div class="trend-bar" style="height:'+h+'px" title="'+day.done+' done"></div><div class="trend-day">'+lbl+'</div></div>';});
    body+='</div></div></div>';
    // Report progress cards
    if(data.reportProgress&&data.reportProgress.length){
      body+='<div class="card"><div class="card-header"><span class="card-title">Report Progress</span></div><div class="rpt-prog-grid">';
      data.reportProgress.forEach(function(rp){var t2=(rp.done||0)+(rp.pending||0)+(rp.skip||0)||1;var p2=Math.round((rp.done||0)/t2*100);
        body+='<div class="rpt-prog-card'+(rp.late?' has-late':'')+'"><div class="rpt-prog-name">'+rp.name+'</div>'+
          '<div class="rpt-prog-bar-bg"><div class="rpt-prog-bar-fill" style="width:'+p2+'%"></div></div>'+
          '<div class="rpt-prog-stats"><span style="color:var(--done-t)">'+rp.done+' Done</span><span style="color:#f59e0b;margin-left:6px">'+rp.pending+' Pend</span></div></div>';});
      body+='</div></div>';
    }
    // Pending MIS
    var pk=Object.keys(data.pendingMIS||{});
    if(pk.length){body+='<div class="card"><div class="card-header"><span class="card-title">Previously Pending</span></div>';
      pk.forEach(function(r){body+='<div class="pending-item"><div class="pending-rpt">'+r+'</div><div class="pending-comp">'+data.pendingMIS[r].join(', ')+'</div></div>';});
      body+='</div>';}
    // Due today tasks
    if(data.kanban&&data.kanban.dueToday&&data.kanban.dueToday.length){
      body+='<div class="card"><div class="card-header"><span class="card-title">Due Today</span></div>';
      data.kanban.dueToday.forEach(function(t){body+='<div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:600">'+t.title+'</span>'+sBadge(t.status)+'</div>';});
      body+='</div>';}
    html('db-body',body);
  });
}
// ══════════════════════════════════════════════════════════════════════════════
// MIS ENTRY
// ══════════════════════════════════════════════════════════════════════════════
function loadMIS(){
  var pg=el('page-mis');
  pg.innerHTML='<div class="page-header"><div class="page-title">MIS Entry</div></div>'+
    '<div class="page-body" id="mis-body"><div style="text-align:center;padding:40px">'+spD()+' Loading...</div></div>';
  gs('getInitialFormData',[],function(err,d){
    if(err||!d){html('mis-body','<div class="empty">Error loading form</div>');return;}
    var win=d.windowStatus;
    var winBar=win.open?'':'<div class="win-bar" style="display:block">⛔ Submission window closed: '+win.start+' to '+win.end+' | Now: '+win.now+'</div>';
    var tabs=['MIS Report','Data Update','Tasks'];
    var tH='<div class="mis-tabs">'+tabs.map(function(t,i){return'<button class="mis-tab'+(i===0?' active':'')+'" onclick="mTab('+(i)+')">'+t+'</button>';}).join('')+'</div>';
    html('mis-body',winBar+tH+'<div class="mis-body"><div id="mp-0" class="mis-panel active"></div><div id="mp-1" class="mis-panel"></div><div id="mp-2" class="mis-panel"></div></div>');
    rMISPanel(d);rDUPanel(d);rTaskPanel(d);
  });
}
window.mTab=function(i){document.querySelectorAll('.mis-tab').forEach(function(t,j){t.classList.toggle('active',i===j);});document.querySelectorAll('.mis-panel').forEach(function(p,j){p.classList.toggle('active',i===j);});};
// MIS Report Panel
function rMISPanel(d){
  var eO=(d.employees||[]).map(function(e){return'<option>'+e+'</option>';}).join('');
  var rO=(d.reports||[]).filter(function(r){return r.dueToday;}).map(function(r){return'<option>'+r.name+(r.deadline?' (by '+r.deadline+')':'')+'</option>';}).join('');
  var h='<div class="sess-bar">'+
    '<div><span class="sess-label">Date</span><input type="date" id="m-date" value="'+d.today+'"></div>'+
    '<div><span class="sess-label">Employee</span><select id="m-emp">'+eO+'</select></div>'+
    '<div><span class="sess-label">Report</span><select id="m-rpt">'+rO+'</select></div>'+
    '</div><button class="load-btn" onclick="mLoad()">Load Components</button>'+
    '<div id="m-comp"></div><div id="m-msg" class="msg-box"></div><div id="m-dup" class="dup-box"></div>';
  html('mp-0',h);
  // Pre-select current user if in list
  var eSel=el('m-emp');
  if(eSel&&U.name){for(var i=0;i<eSel.options.length;i++){if(eSel.options[i].value===U.name){eSel.selectedIndex=i;break;}}}
}
window.mLoad=function(){
  var rpt=el('m-rpt')&&el('m-rpt').value;
  var emp=el('m-emp')&&el('m-emp').value;
  if(!rpt||!emp){alert('Select employee and report');return;}
  html('m-comp','<div style="text-align:center;padding:20px">'+spD()+' Loading...</div>');
  _misFormOpenTime=Date.now();
  gs('getComponentsForReport',[rpt],function(err,comps){
    if(err||!comps){html('m-comp','<div class="empty">Error</div>');return;}
    if(!comps.length){html('m-comp','<div class="empty">No components configured</div>');return;}
    var h='<div class="item-section"><div class="item-head"><span>Components <span class="item-count-badge">'+comps.length+'</span></span>'+
      '<div style="display:flex;gap:5px"><button class="bb" onclick="mBulk(\\'Done\\')">All Done</button>'+
      '<button class="bb" onclick="mBulk(\\'Pending\\')">Pending</button><button class="bb" onclick="mBulk(\\'Skip\\')">Skip</button></div></div>'+
      '<div class="items-list">';
    comps.forEach(function(c,i){
      var lb=c.lastDate?'<span class="ld">'+c.lastStatus+' '+c.lastDate+'</span>':'';
      h+='<div class="irow"><div class="irow-name">'+c.name+lb+(c.assignee?'<span class="imeta">'+c.assignee+'</span>':'')+'</div>'+
        '<div class="comp-grid">'+
        '<input class="ni center" type="number" id="mc-'+i+'" value="'+((c.lastCount)||0)+'" min="0">'+
        '<select class="ss '+(c.lastStatus||'done').toLowerCase()+'" id="ms-'+i+'" onchange="this.className=\\'ss \\'+this.value.toLowerCase()">'+
        '<option'+(c.lastStatus==='Done'?' selected':'')+'>Done</option><option'+(c.lastStatus==='Pending'?' selected':'')+'>Pending</option><option'+(c.lastStatus==='Skip'?' selected':'')+'>Skip</option></select>'+
        '<input class="ni" type="text" id="mr-'+i+'" value="'+((c.lastRemarks)||'')+'" placeholder="Remarks...">'+
        '</div></div>';
    });
    h+='</div></div><input type="hidden" id="mc-cnt" value="'+comps.length+'">'+
      '<button class="sub-btn" style="margin-top:12px" onclick="mSub(false)">Submit Report</button>';
    window._mComps=comps;
    html('m-comp',h);
  });
};
window.mBulk=function(s){var n=parseInt((el('mc-cnt')||{}).value||0);for(var i=0;i<n;i++){var sel=el('ms-'+i);if(sel){sel.value=s;sel.className='ss '+s.toLowerCase();}}};
window.mSub=function(force){
  var rpt=(el('m-rpt')||{}).value,emp=(el('m-emp')||{}).value,date=(el('m-date')||{}).value;
  var comps=window._mComps||[];
  var entries=comps.map(function(c,i){return{component:c.name,status:(el('ms-'+i)||{}).value||'Done',dataCount:parseInt((el('mc-'+i)||{}).value)||0,remarks:(el('mr-'+i)||{}).value||'',minCount:c.minCount||0};});
  var btn=document.querySelector('.sub-btn');if(btn){btn.disabled=true;btn.innerHTML=sp()+' Submitting...';}
  showMsg('m-msg','','',true);el('m-dup').style.display='none';
  gs('submitEntries',[{employee:emp,report:rpt,date:date,entries:entries,formOpenTime:_misFormOpenTime,forceAmend:!!force}],function(err,res){
    if(btn){btn.disabled=false;btn.innerHTML='Submit Report';}
    if(err||!res){showMsg('m-msg','Error: '+(err?err.message:'Unknown'),'err');return;}
    if(res.duplicate){
      var dup=el('m-dup');dup.style.display='block';
      dup.innerHTML=res.message+'<br><button class="db db-ok" onclick="mSub(true)">Overwrite</button><button class="db db-no" onclick="el(\\'m-dup\\').style.display=\\'none\\'">Cancel</button>';
      return;}
    showMsg('m-msg',res.message,res.success?'ok':'err');
    if(res.success){window._mComps=null;html('m-comp','');}
  });
};
// Data Update Panel
function rDUPanel(d){
  var h='<div class="sess-bar">'+
    '<div><span class="sess-label">Date</span><input type="date" id="du-date" value="'+d.today+'"></div>'+
    '<div><span class="sess-label">Employee</span><select id="du-emp">'+(d.employees||[]).map(function(e){return'<option>'+e+'</option>';}).join('')+'</select></div>'+
    '<div><span class="sess-label">Commodity</span><select id="du-comm" onchange="duTypes()">'+
    '<option value="">-- Select --</option></select></div></div>'+
    '<div id="du-type-row" style="display:none;margin:8px 0"><select id="du-type" style="width:100%;padding:7px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:12px" onchange="duFactors()"><option>-- Select Type --</option></select></div>'+
    '<button class="load-btn" onclick="duComm()" style="margin-bottom:10px">Load Commodities</button>'+
    '<div id="du-fac"></div><div id="du-msg" class="msg-box"></div><div id="du-dup" class="dup-box"></div>';
