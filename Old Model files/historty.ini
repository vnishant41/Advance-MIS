// TEAM DASHBOARD
// ══════════════════════════════════════════════════════════════════════════════
function loadTeam(){
  var pg=el('page-team');
  pg.innerHTML='<div class="page-header"><div class="page-title">Team Dashboard</div></div>'+
    '<div class="page-body" id="tm-body"><div style="text-align:center;padding:40px">'+spD()+' Loading...</div></div>';
  gs('getTeamDashboard',[],function(err,data){
    if(err||!data||!data.success){html('tm-body','<div class="empty">'+((data&&data.message)||'Error')+'</div>');return;}
    var h='';
    // Sprint info
    if(data.sprint){
      var sp=data.sprint;
      var pct=sp.total>0?Math.round(sp.done/sp.total*100):0;
      h+='<div class="sprint-info"><div class="sprint-name">🏃 '+sp.sprint.name+'</div><div class="sprint-dates">'+sp.sprint.startDate+' → '+sp.sprint.endDate+'</div>'+
        '<div class="sprint-metrics"><div class="sm"><div class="sm-value">'+sp.done+'/'+sp.total+'</div><div class="sm-label">Tasks</div></div>'+
        '<div class="sm"><div class="sm-value">'+pct+'%</div><div class="sm-label">Complete</div></div>'+
        '<div class="sm"><div class="sm-value">'+sp.donePoints+'/'+sp.points+'</div><div class="sm-label">Points</div></div></div></div>';
    }
    // Kanban alerts
    var kb=data.kanban||{};
    if(kb.overdue&&kb.overdue.length){h+='<div class="overdue-card"><div class="overdue-title">⚠️ Overdue Tasks</div>';kb.overdue.forEach(function(t){h+='<div class="overdue-item"><span>'+t.title+'</span><span>'+t.assignedToName+'</span></div>';});h+='</div>';}
    if(kb.blocked&&kb.blocked.length){h+='<div class="card" style="border-left:4px solid #ef4444"><div class="card-header"><span class="card-title">🚫 Blocked Tasks</span></div>';kb.blocked.forEach(function(t){h+='<div style="padding:5px 0;font-size:12px">'+t.title+' — '+t.assignedToName+'</div>';});h+='</div>';}
    // Team cards
    h+='<div class="card-header" style="margin-bottom:12px"><span class="card-title">Team Members</span></div><div class="team-grid">';
    (data.team||[]).forEach(function(m){
      var tot=m.done+m.pending+m.skip||1;
      var pct2=Math.round(m.done/tot*100);
      h+='<div class="team-card'+(m.late>0?' late-alert':'')+'"><div class="tc-name">'+m.name+'</div><div class="tc-role">'+rBadge(m.role)+'</div>'+
        '<div class="tc-stats"><div class="tcs" style="background:var(--done-bg);color:var(--done-t)">'+m.done+'</div>'+
        '<div class="tcs" style="background:var(--pend-bg);color:var(--pend-t)">'+m.pending+'</div>'+
        '<div class="tcs" style="background:var(--skip-bg);color:var(--skip-t)">'+m.skip+'</div></div>'+
        '<div class="tc-bar"><div class="tc-bar-fill" style="width:'+pct2+'%"></div></div>'+
        '<div style="font-size:10px;color:var(--muted);margin-top:6px">Last: '+(m.lastActive||'N/A')+'</div></div>';
    });
    h+='</div>';
    html('tm-body',h);
  });
}
