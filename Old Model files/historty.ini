function loadMyTasks(){
  var pg=el('page-mytasks');
  pg.innerHTML='<div class="page-header"><div class="page-title">My Tasks</div></div>'+
    '<div class="page-body" id="mt-body"><div style="text-align:center;padding:40px">'+spD()+' Loading...</div></div>';
  gs('getMyTaskTable',[],function(err,data){
    if(err||!data||!data.success){html('mt-body','<div class="empty">Error</div>');return;}
    var h='<div class="filter-bar"><input type="text" id="mt-search" placeholder="Search..." oninput="mtFilter()"><select id="mt-type" onchange="mtFilter()"><option value="">All Types</option><option>MISReport</option><option>DataUpdate</option><option>Task</option></select><select id="mt-st" onchange="mtFilter()"><option value="">All Status</option><option>Done</option><option>Pending</option><option>Skip</option></select></div>';
    h+='<div class="tbl-wrap"><table class="dtbl" id="mt-tbl"><thead><tr><th>Date</th><th>Type</th><th>Report/Task</th><th>Component</th><th>Status</th><th>Count</th><th>Remarks</th></tr></thead><tbody>';
    (data.log||[]).forEach(function(r){
      h+='<tr data-type="'+r.entryType+'" data-st="'+r.status+'" data-txt="'+(r.report+r.component).toLowerCase()+'"><td>'+r.date+'</td><td>'+r.entryType+'</td><td>'+r.report+'</td><td>'+r.component+'</td><td>'+sBadge(r.status)+(r.late?'<span class="badge b-late" style="margin-left:4px">Late</span>':'')+'</td><td>'+r.count+'</td><td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+r.remarks+'</td></tr>';
    });
    h+='</tbody></table></div>';
    html('mt-body',h);
  });
}
window.mtFilter=function(){
  var s=(el('mt-search')||{}).value.toLowerCase(),ty=(el('mt-type')||{}).value,st=(el('mt-st')||{}).value;
  document.querySelectorAll('#mt-tbl tbody tr').forEach(function(tr){
    var ok=(!ty||tr.dataset.type===ty)&&(!st||tr.dataset.st===st)&&(!s||tr.dataset.txt.indexOf(s)>=0);
    tr.style.display=ok?'':'none';
  });
};
