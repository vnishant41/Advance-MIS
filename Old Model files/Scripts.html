    sel.innerHTML = '<option value="">— select —</option>' +
      CCSTATE.users.filter(u => u.active).map(u =>
        '<option value="' + escapeHtml(u.email) + '">' + escapeHtml(u.name) + ' · ' + escapeHtml(u.email) + (u.dept ? ' (' + escapeHtml(u.dept) + ')' : '') + '</option>'
      ).join('');
  }

  function ccFiltered() {
    const q = document.getElementById('ccSearch').value.toLowerCase().trim();
    const r = document.getElementById('ccRoleFilter').value;
    const d = document.getElementById('ccDeptFilter').value;
    const a = document.getElementById('ccActiveFilter').value;
    return CCSTATE.users.filter(u =>
      (!q || (u.email + ' ' + u.name).toLowerCase().includes(q)) &&
      (!r || u.role === r) &&
      (!d || u.dept === d) &&
      (!a || (a === 'yes' ? u.active : !u.active))
    );
  }

  function ccRenderUsers() {
    const list = ccFiltered();
    document.getElementById('ccUserCount').textContent = list.length + ' of ' + CCSTATE.users.length + ' users';
    if (!list.length) { document.getElementById('ccUsers').innerHTML = '<div class="empty">No users match filters.</div>'; return; }

    const html = '<table><thead><tr>' +
      '<th><input type="checkbox" id="ccSelAll" onchange="ccToggleSelAll(this.checked)"></th>' +
      '<th>Email</th><th>Name</th><th>Role</th><th>Dept</th><th>Active</th><th>Last Login</th><th>Total Entries</th><th></th>' +
      '</tr></thead><tbody>' +
      list.map(u => {
        const sel = CCSTATE.selected.has(u.email) ? 'checked' : '';
        return '<tr data-email="' + escapeHtml(u.email) + '">' +
          '<td><input type="checkbox" ' + sel + ' onchange="ccToggleSel(\'' + escapeHtml(u.email) + '\', this.checked)"></td>' +
          '<td>' + escapeHtml(u.email) + '</td>' +
          '<td><input type="text" value="' + escapeHtml(u.name) + '" data-field="name" onchange="ccInlineSave(this)"></td>' +
          '<td><select data-field="role" onchange="ccInlineSave(this)">' +
          ['Teammate', 'Manager', 'SuperAdmin'].map(r => '<option' + (r === u.role ? ' selected' : '') + '>' + r + '</option>').join('') +
          '</select></td>' +
          '<td><input type="text" value="' + escapeHtml(u.dept) + '" data-field="dept" onchange="ccInlineSave(this)"></td>' +
          '<td><input type="checkbox" ' + (u.active ? 'checked' : '') + ' data-field="active" onchange="ccInlineSave(this)"></td>' +
          '<td style="font-size:12px; color:#94a3b8;">' + (u.lastLogin ? escapeHtml(u.lastLogin) : '<span style="color:#475569;">never</span>') + '</td>' +
          '<td style="text-align:right;">' + u.totalEntries + '</td>' +
          '<td><button class="danger" onclick="ccRemove(\'' + escapeHtml(u.email) + '\')">Remove</button></td>' +
          '</tr>';
      }).join('') + '</tbody></table>';
    document.getElementById('ccUsers').innerHTML = html;
  }

  function ccToggleSel(email, checked) {
    if (checked) CCSTATE.selected.add(email);
    else CCSTATE.selected.delete(email);
  }

  function ccToggleSelAll(checked) {
    ccFiltered().forEach(u => {
      if (checked) CCSTATE.selected.add(u.email);
      else CCSTATE.selected.delete(u.email);
    });
    ccRenderUsers();
  }

  function ccInlineSave(el) {
    const tr = el.closest('tr');
    const email = tr.getAttribute('data-email');
    const u = CCSTATE.users.find(x => x.email === email);
    if (!u) return;
    const fields = {};
    tr.querySelectorAll('[data-field]').forEach(f => {
      if (f.type === 'checkbox') fields[f.getAttribute('data-field')] = f.checked;
      else fields[f.getAttribute('data-field')] = f.value;
    });
    rpc('updateUser', email, fields.name, fields.role, fields.dept, fields.active).then(r => {
      if (r.success) { Object.assign(u, fields); toast('Saved ' + email, 'success'); }
      else { toast(r.message || 'Failed', 'error'); ccRenderUsers(); }
    }).catch(e => toast(String(e), 'error'));
  }

  function ccRemove(email) {
    if (!confirm('Remove ' + email + '?')) return;
    rpc('removeUser', email).then(r => {
      if (r.success) { toast('Removed', 'success'); loadControl(); }
      else toast(r.message || 'Failed', 'error');
    }).catch(e => toast(String(e), 'error'));
  }

  function ccBulkSetActive(active) {
    const emails = Array.from(CCSTATE.selected);
    if (!emails.length) { toast('Select at least one user', 'error'); return; }
    if (!confirm((active ? 'Activate' : 'Deactivate') + ' ' + emails.length + ' user(s)?')) return;
    rpc('bulkSetActive', emails, active).then(r => {
      if (r.success) { toast('Updated ' + r.changed + ' user(s)', 'success'); loadControl(); }
      else toast(r.message || 'Failed', 'error');
    }).catch(e => toast(String(e), 'error'));
  }

  function ccExportCsv() {
    const list = ccFiltered();
    const cols = ['email', 'name', 'role', 'dept', 'active', 'lastLogin', 'totalEntries'];
    const lines = [cols.join(',')].concat(list.map(u => cols.map(c => csvCell(u[c])).join(',')));
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'users-' + STATE.today + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  }
  /* ── MODULE TOGGLES ───────────────────────────────────────────── */
  function ccRenderToggles() {
    const keys = Object.keys(CCSTATE.modules);
    document.getElementById('ccToggles').innerHTML =
      '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:8px;">' +
      keys.map(k =>
        '<label style="display:flex; align-items:center; gap:8px; padding:8px; background:#0f172a; border-radius:6px;">' +
        '<input type="checkbox" data-mod="' + escapeHtml(k) + '"' + (CCSTATE.modules[k] ? ' checked' : '') + '>' +
        '<span>' + escapeHtml(CCSTATE.labels[k] || k) + '</span>' +
        '</label>'
      ).join('') + '</div>';
  }

  function ccSaveToggles() {
    const out = {};
    document.querySelectorAll('#ccToggles input[type=checkbox]').forEach(cb => {
      out[cb.getAttribute('data-mod')] = cb.checked;
    });
    document.getElementById('ccTogglesMsg').textContent = 'Saving…';
    rpc('saveModuleToggles', out).then(r => {
      document.getElementById('ccTogglesMsg').textContent = '';
      if (r.success) { toast('Toggles saved. Reload to apply.', 'success'); }
      else toast(r.message || 'Failed', 'error');
    }).catch(e => { document.getElementById('ccTogglesMsg').textContent = ''; toast(String(e), 'error'); });
  }

  /* ── PROXY ENTRY HAND-OFF ─────────────────────────────────────── */
  function ccProxyTo(target) {
    const email = document.getElementById('ccProxyUser').value;
    if (!email) { toast('Select a user first', 'error'); return; }
    STATE.proxyTarget = email;
    navigate(target);
  }

  /* ── QUICK ACTIONS ────────────────────────────────────────────── */
  function ccForceUnlock() {
    const id = document.getElementById('ccUnlockId').value.trim();
    if (!id) { toast('log_id required', 'error'); return; }
    document.getElementById('ccUnlockMsg').textContent = 'Working…';
    rpc('requestAmend', id).then(r => {
      document.getElementById('ccUnlockMsg').textContent = '';
      if (r.success) toast(r.message, 'success');
      else toast(r.message || 'Failed', 'error');
    }).catch(e => { document.getElementById('ccUnlockMsg').textContent = ''; toast(String(e), 'error'); });
  }

  function ccBulkAmend() {
    const filter = {
      employeeEmail: document.getElementById('ccBaEmail').value.trim().toLowerCase(),
      entryType: document.getElementById('ccBaType').value,
      topic: document.getElementById('ccBaTopic').value.trim(),
      entryDate: document.getElementById('ccBaDate').value
    };
    if (!filter.employeeEmail) { toast('Email required', 'error'); return; }
    if (!confirm('Amend all matching entries for ' + filter.employeeEmail + '?')) return;
    document.getElementById('ccBaMsg').textContent = 'Working…';
    rpc('bulkAmendEntries', filter).then(r => {
      document.getElementById('ccBaMsg').textContent = '';
      if (r.success) toast('Amended ' + r.count + ' entries', 'success');
      else toast(r.message || 'Failed', 'error');
    }).catch(e => { document.getElementById('ccBaMsg').textContent = ''; toast(String(e), 'error'); });
  }

  function ccToggleLock() {
    document.getElementById('ccLockMsg').textContent = 'Working…';
    rpc('toggleDuplicateLock').then(r => {
      document.getElementById('ccLockMsg').textContent = '';
      if (r.success) {
        toast('Lock toggled', 'success');
        rpc('getSettings').then(s => { document.getElementById('ccDupState').textContent = s.lockDuplicate ? 'ON' : 'OFF'; });
      } else toast(r.message || 'Failed', 'error');
    }).catch(e => { document.getElementById('ccLockMsg').textContent = ''; toast(String(e), 'error'); });
  }

  function ccTrigger() {
    const name = document.getElementById('ccAlertName').value;
    if (!confirm('Manually run ' + name + '?')) return;
    document.getElementById('ccAlertMsg').textContent = 'Running…';
    rpc('triggerAlert', name).then(r => {
      document.getElementById('ccAlertMsg').textContent = '';
      if (r.success) toast(r.message, 'success');
      else toast(r.message || 'Failed', 'error');
    }).catch(e => { document.getElementById('ccAlertMsg').textContent = ''; toast(String(e), 'error'); });
  }


  /* ── JsAnalytics ──────────────────────────────────── */
  function loadAnalytics() {
    document.getElementById('anKpi').innerHTML = viewLoaderHtml('Loading KPI…');
    loadKpiBreakdown();
    loadSlaBreaches();
    loadPendingAnalysis();
  }

  function loadKpiBreakdown() {
    rpc('getKpiBreakdown').then(r => {
      if (!r.success) { toast(r.message || 'Failed', 'error'); return; }
      document.getElementById('anKpi').innerHTML =
        '<div class="kpi">' +
        '<div class="box green"><h4>Done Rate</h4><div class="num">' + r.doneRate + '%</div></div>' +
        '<div class="box orange"><h4>Pending Rate</h4><div class="num">' + r.pendingRate + '%</div></div>' +
        '<div class="box red"><h4>Late Rate</h4><div class="num">' + r.lateRate + '%</div></div>' +
        '<div class="box red"><h4>SLA Breaches</h4><div class="num">' + r.slaBreach + '</div></div>' +
        '</div>' +
        '<div style="color:#94a3b8; font-size:12px; margin-top:8px;">' +
        'Window: last ' + r.total + ' entries. Done: ' + r.counts.done +
        ' · Pending: ' + r.counts.pending + ' · Skip: ' + r.counts.skip +
        ' · Late: ' + r.counts.late + '</div>';
    }).catch(e => toast(String(e), 'error'));
  }

  function loadSlaBreaches() {
    document.getElementById('anSla').innerHTML = skeletonRows(3);
    rpc('getSlaBreaches').then(r => {
      if (!r.success) { document.getElementById('anSla').innerHTML = '<div class="empty">' + escapeHtml(r.message || '') + '</div>'; return; }
      const list = r.data || [];
      if (!list.length) { document.getElementById('anSla').innerHTML = '<div class="empty">No SLA breaches.</div>'; return; }
      document.getElementById('anSla').innerHTML =
        '<table><thead><tr><th>Topic</th><th>Sub-topic</th><th>Breaches</th><th>Last</th><th>Employees</th></tr></thead><tbody>' +
        list.map(s =>
          '<tr><td>' + escapeHtml(s.topic) + '</td>' +
          '<td>' + escapeHtml(s.subTopic) + '</td>' +
          '<td><span class="badge late">' + s.breaches + '</span></td>' +
          '<td>' + escapeHtml(s.lastBreach) + '</td>' +
          '<td style="font-size:12px; color:#94a3b8;">' + escapeHtml(s.employees) + '</td></tr>'
        ).join('') + '</tbody></table>';
    }).catch(e => toast(String(e), 'error'));
  }

  function loadPendingAnalysis() {
    document.getElementById('anPending').innerHTML = skeletonRows(3);
    rpc('getPendingAnalysis').then(r => {
      if (!r.success) { document.getElementById('anPending').innerHTML = '<div class="empty">' + escapeHtml(r.message || '') + '</div>'; return; }
      const list = r.data || [];
      if (!list.length) { document.getElementById('anPending').innerHTML = '<div class="empty">No persistent pending items.</div>'; return; }
      document.getElementById('anPending').innerHTML =
        '<table><thead><tr><th>Topic</th><th>Sub-topic</th><th>Pending</th><th>Done</th><th>Last Done</th><th>Last Pending</th><th>Pending %</th></tr></thead><tbody>' +
        list.map(p =>
          '<tr><td>' + escapeHtml(p.topic) + '</td>' +
          '<td>' + escapeHtml(p.subTopic) + '</td>' +
          '<td>' + p.pending + '</td><td>' + p.done + '</td>' +
          '<td>' + escapeHtml(p.lastDone) + '</td>' +
          '<td>' + escapeHtml(p.lastPending) + '</td>' +
          '<td><span class="badge ' + (p.pendingRate >= 70 ? 'late' : 'pending') + '">' + p.pendingRate + '%</span></td></tr>'
        ).join('') + '</tbody></table>';
    }).catch(e => toast(String(e), 'error'));
  }

  function loadComparison() {
    const c = document.getElementById('anCommodity').value.trim();
    if (!c) { toast('Commodity required', 'error'); return; }
    document.getElementById('anComparison').innerHTML = skeletonRows(3);
    rpc('getCommodityComparison', c).then(r => {
      if (!r.success) { document.getElementById('anComparison').innerHTML = '<div class="empty">' + escapeHtml(r.message || '') + '</div>'; return; }
      const slot = (s) => '<div class="box blue"><h4>' + s.date + '</h4>' +
        '<div style="font-size:13px; line-height:1.5; margin-top:6px;">Total: <b>' + s.total + '</b><br>Done: ' + s.done + ' · Pending: ' + s.pending + ' · Skip: ' + s.skip + '</div></div>';
      document.getElementById('anComparison').innerHTML =
        '<div class="kpi" style="grid-template-columns:repeat(3, 1fr);">' +
        slot(r.today) + slot(r.yesterday) + slot(r.lastWeek) +
        '</div>';
    }).catch(e => toast(String(e), 'error'));
  }

  /* ── EXPORT ───────────────────────────────────────────────────── */
  function _expFilters() {
    return {
      entryType: document.getElementById('anExpType').value,
      commodity: document.getElementById('anExpCommodity').value.trim(),
      user: document.getElementById('anExpUser').value.trim().toLowerCase(),
      dateFrom: document.getElementById('anExpFrom').value,
      dateTo: document.getElementById('anExpTo').value
    };
  }

  function exportCsv() {
    document.getElementById('anExpMsg').textContent = 'Exporting…';
    rpc('exportEntriesCsv', _expFilters()).then(r => {
      document.getElementById('anExpMsg').textContent = '';
      if (!r.success) { toast(r.message || 'Failed', 'error'); return; }
      if (r.count === 0) { toast('No rows match filter', 'error'); return; }
      const blob = new Blob([r.csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'mis-export-' + STATE.today + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 500);
      toast('Exported ' + r.count + ' rows', 'success');
    }).catch(e => { document.getElementById('anExpMsg').textContent = ''; toast(String(e), 'error'); });
  }

  function exportPdf() {
    document.getElementById('anExpMsg').textContent = 'Generating PDF…';
    rpc('exportEntriesPdf', _expFilters()).then(r => {
      document.getElementById('anExpMsg').textContent = '';
      if (!r.success) { toast(r.message || 'Failed', 'error'); return; }
      if (r.count === 0) { toast('No rows match filter', 'error'); return; }
      const bytes = atob(r.base64);
      const buf = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i);
      const blob = new Blob([buf], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = r.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 500);
      toast('Exported ' + r.count + ' rows', 'success');
    }).catch(e => { document.getElementById('anExpMsg').textContent = ''; toast(String(e), 'error'); });
  }

  /* ── JsAudit ──────────────────────────────────── */
  const ADSTATE = { rows: [], actions: [] };

  function loadAudit() {
    if (STATE.user.role !== 'SuperAdmin') return;
    document.getElementById('adRows').innerHTML = skeletonRows(4);

    // Populate action dropdown once.
    if (!ADSTATE.actions.length) {
      rpc('getAuditActions').then(r => {
        if (r.success) {
          ADSTATE.actions = r.data || [];
          const sel = document.getElementById('adAction');
          const cur = sel.value;
          sel.innerHTML = '<option value="">All</option>' +
            ADSTATE.actions.map(a => '<option value="' + escapeHtml(a) + '">' + escapeHtml(a) + '</option>').join('');
          sel.value = cur || '';
        }
      });
    }

    rpc('getAuditLog', _adFilters()).then(r => {
      if (!r.success) { document.getElementById('adRows').innerHTML = '<div class="empty">' + escapeHtml(r.message || '') + '</div>'; return; }
      ADSTATE.rows = r.data || [];
      adRender();
    }).catch(e => toast(String(e), 'error'));
  }

  function _adFilters() {
    return {
      user: document.getElementById('adUser').value.trim().toLowerCase(),
      action: document.getElementById('adAction').value,
      dateFrom: document.getElementById('adFrom').value,
      dateTo: document.getElementById('adTo').value
    };
  }

  function adClear() {
    document.getElementById('adUser').value = '';
    document.getElementById('adAction').value = '';
    document.getElementById('adFrom').value = '';
    document.getElementById('adTo').value = '';
    loadAudit();
  }

  function adRender() {
    const list = ADSTATE.rows;
    if (!list.length) { document.getElementById('adRows').innerHTML = '<div class="empty">No audit entries match filter.</div>'; return; }
    document.getElementById('adRows').innerHTML =
      '<div style="margin-bottom:8px; color:#94a3b8; font-size:12px;">' + list.length + ' entries (newest first)</div>' +
      '<table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Type</th><th>Target</th><th>Before</th><th>After</th><th>Proxy</th></tr></thead><tbody>' +
      list.map(r =>
        '<tr><td style="font-size:11px; white-space:nowrap;">' + escapeHtml(r.timestamp) + '</td>' +
        '<td>' + escapeHtml(r.actor) + '</td>' +
        '<td><span class="badge">' + escapeHtml(r.action) + '</span></td>' +
        '<td>' + escapeHtml(r.targetType) + '</td>' +
        '<td style="font-family:monospace; font-size:11px; max-width:160px; overflow:hidden; text-overflow:ellipsis;" title="' + escapeHtml(r.targetId) + '">' + escapeHtml(truncate(r.targetId, 30)) + '</td>' +
        '<td style="font-family:monospace; font-size:11px; max-width:200px; overflow:hidden; text-overflow:ellipsis;" title="' + escapeHtml(r.before) + '">' + escapeHtml(truncate(r.before, 60)) + '</td>' +
        '<td style="font-family:monospace; font-size:11px; max-width:200px; overflow:hidden; text-overflow:ellipsis;" title="' + escapeHtml(r.after) + '">' + escapeHtml(truncate(r.after, 60)) + '</td>' +
        '<td>' + (r.isProxy ? '<span class="badge proxy">PROXY</span>' : '–') + '</td></tr>'
      ).join('') + '</tbody></table>';
  }

  function truncate(s, n) {
    s = String(s == null ? '' : s);
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  function adExport() {
    if (!ADSTATE.rows.length) { toast('Load entries first', 'error'); return; }
    const cols = ['timestamp', 'actor', 'action', 'targetType', 'targetId', 'before', 'after', 'isProxy'];
    const lines = [cols.join(',')].concat(ADSTATE.rows.map(r => cols.map(c => csvCell(r[c])).join(',')));
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'audit-' + STATE.today + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  }

  /* ── JsLeaderControl ──────────────────────────────── */
  const LC_VIEWS = ['dashboard', 'mis', 'du', 'task', 'roadster', 'kanban', 'analytics'];
  const LC_STATE = { rows: [] };

  function loadLeaderControl() {
    if (!STATE.user || STATE.user.role !== 'SuperAdmin') return;
    document.getElementById('lcTable').innerHTML = skeletonRows(3);
    rpc('getLeaderConfig').then(r => {
      if (!r || !r.success) {
        document.getElementById('lcTable').innerHTML = '<div class="empty">' + escapeHtml(r && r.message || 'No leaders found') + '</div>';
        return;
      }
      LC_STATE.rows = r.data || [];
      lcRender();
    }).catch(e => toast(String(e), 'error'));
  }

  function lcRender() {
    const rows = LC_STATE.rows;
    if (!rows.length) {
      document.getElementById('lcTable').innerHTML = '<div class="empty">No Leader-role users found. Add users with role "Leader" in Admin.</div>';
      return;
    }

    const viewLabels = {
      dashboard: 'Dashboard', mis: 'MIS Report', du: 'Data Update', task: 'Tasks',
      roadster: 'Daily Roster', kanban: 'Kanban', analytics: 'Analytics'
    };

    document.getElementById('lcTable').innerHTML =
      '<table style="width:100%; border-collapse:collapse;">' +
      '<thead><tr><th style="text-align:left; padding:8px; color:#94a3b8;">Leader</th>' +
      LC_VIEWS.map(v => '<th style="padding:8px; color:#94a3b8; text-align:center; font-size:12px;">' + escapeHtml(viewLabels[v] || v) + '</th>').join('') +
      '<th style="padding:8px;"></th></tr></thead><tbody>' +
      rows.map(row => {
        const allowed = new Set(row.views || []);
        return '<tr style="border-top:1px solid #1e293b;">' +
          '<td style="padding:8px;"><strong>' + escapeHtml(row.name || row.email) + '</strong><br><span style="font-size:11px;color:#94a3b8;">' + escapeHtml(row.email) + '</span></td>' +
          LC_VIEWS.map(v =>
            '<td style="text-align:center; padding:8px;">' +
            '<input type="checkbox" class="lc-cb" data-email="' + escapeHtml(row.email) + '" data-view="' + v + '"' +
            (allowed.has(v) ? ' checked' : '') + '></td>'
          ).join('') +
          '<td style="padding:8px;"><button class="primary" style="font-size:12px; padding:5px 12px;" onclick="saveLeaderRow(\'' + escapeHtml(row.email) + '\')">Save</button></td>' +
          '</tr>';
      }).join('') + '</tbody></table>';
  }

  function saveLeaderRow(email) {
    const views = [];
    document.querySelectorAll('.lc-cb[data-email="' + email + '"]').forEach(cb => {
      if (cb.checked) views.push(cb.getAttribute('data-view'));
    });
    const msg = document.getElementById('lcMsg');
    msg.textContent = 'Saving…';
    rpc('saveLeaderConfig', email, views).then(r => {
      msg.textContent = '';
      if (r && r.success) {
        toast('Leader access saved for ' + email, 'success');
        const row = LC_STATE.rows.find(x => x.email === email);
        if (row) row.views = views;
      } else {
        toast((r && r.message) || 'Failed', 'error');
      }
    }).catch(e => { msg.textContent = ''; toast(String(e), 'error'); });
  }

</script>
