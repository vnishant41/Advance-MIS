<script>
  /* ── JsCore ──────────────────────────────────── */
  /* ── GLOBAL STATE ─────────────────────────────────────────────── */
  let STATE = {
    user: BOOT ? BOOT.user : null,
    modules: BOOT ? BOOT.modules || {} : {},
    today: BOOT ? BOOT.today : '',
    window: BOOT ? BOOT.window || { open: true } : { open: true },
    currentView: null
  };

  /* ── RPC HELPER ───────────────────────────────────────────────── */
  function rpc(fn, ...args) {
    return new Promise((resolve, reject) => {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        // Localhost fallback
        if (window.rpcLocal) return window.rpcLocal(fn, ...args).then(resolve).catch(reject);
        return reject(new Error('google.script.run not found'));
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err))
      [fn](...args);
    });
  }

  /* ── LOGIN LOGIC ──────────────────────────────────────────────── */
  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pwd = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');

    if (!email || !pwd) {
      err.textContent = 'Email and password required';
      err.style.display = 'block';
      return;
    }

    btn.textContent = 'Signing in...';
    btn.disabled = true;
    err.style.display = 'none';

    try {
      const res = await rpc('authenticate', email, pwd);
      if (!res.success) throw new Error(res.message);

      // Save to localStorage for auto-login
      localStorage.setItem('mis.email', email);
      localStorage.setItem('mis.pwd', pwd);

      // Update global state and boot
      updateStateFromBoot(res.data);
      document.getElementById('login').style.display = 'none';
      bootApp();
    } catch (e) {
      err.textContent = e.message;
      err.style.display = 'block';
    } finally {
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  }

  function updateStateFromBoot(data) {
    window.BOOT = data;
    STATE.user = data.user;
    STATE.modules = data.modules || {};
    STATE.today = data.today;
    STATE.window = data.window || { open: true };
  }

  /* ── TOAST ────────────────────────────────────────────────────── */
  function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (type || '');
    setTimeout(() => { el.className = 'toast'; }, 3500);
  }

  /* ── NAVIGATION ───────────────────────────────────────────────── */
  function navigate(view) {
    const btn = document.querySelector('.sidebar .nav-btn[data-view="' + view + '"]');
    if (btn && btn.classList.contains('disabled')) return;

    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.sidebar .nav-btn').forEach(b => b.classList.remove('active'));

    const target = document.getElementById(view);
    if (target) target.classList.add('active');
    if (btn) btn.classList.add('active');

    STATE.currentView = view;

    if (view === 'dashboard') loadDashboard();
    else if (view === 'mis') loadMisForm();
    else if (view === 'du') loadDuForm();
    else if (view === 'task') loadTaskForm();
    else if (view === 'roadster') loadRoadster();
    else if (view === 'kanban') loadKanban();
    else if (view === 'roadsterConfig') loadRoadsterConfig();
    else if (view === 'admin') loadAdmin();
    else if (view === 'control') loadControl();
    else if (view === 'analytics') loadAnalytics();
    else if (view === 'audit') loadAudit();
    else if (view === 'leaderControl') loadLeaderControl();
  }

  /* ── BOOT ─────────────────────────────────────────────────────── */
  function bootApp() {
    if (!STATE.user) return; // safety

    // User badge (legacy left side)
    const ub = document.getElementById('userBadge');
    if (ub) {
      ub.textContent = STATE.user.name + ' (' + STATE.user.role + (STATE.user.dept ? ' · ' + STATE.user.dept : '') + ')';
      ub.style.cursor = 'pointer';
      ub.title = 'Click to view Profile & Settings';
      ub.onclick = openProfileModal;
    }

    // User dropdown menu (new right side)
    const udName = document.getElementById('udName');
    if (udName) udName.textContent = STATE.user.name;

    const udRole = document.getElementById('udRole');
    if (udRole) udRole.textContent = STATE.user.role + (STATE.user.dept ? ' · ' + STATE.user.dept : '');

    const udAvatar = document.getElementById('userMenuAvatar');
    if (udAvatar) udAvatar.textContent = STATE.user.name.charAt(0).toUpperCase();

    // Window badge
    const wb = document.getElementById('windowBadge');
    if (STATE.window.open) {
      wb.textContent = 'Window OPEN ' + STATE.window.start + '–' + STATE.window.end;
    } else {
      wb.textContent = 'Window CLOSED ' + STATE.window.start + '–' + STATE.window.end;
      wb.classList.add('closed');
    }

    // Sidebar gating: hide modules disabled or above role
    const ROLE_LEVEL = { Teammate: 1, Leader: 1.5, Manager: 2, SuperAdmin: 3 };
    document.querySelectorAll('.sidebar .nav-btn').forEach(btn => {
      const mod = btn.getAttribute('data-mod');
      const minRole = btn.getAttribute('data-role');
      let disabled = false;
      if (mod && STATE.modules[mod] === false) disabled = true;
      if (minRole && (ROLE_LEVEL[STATE.user.role] || 0) < (ROLE_LEVEL[minRole] || 0)) disabled = true;
      if (disabled) {
        btn.classList.add('disabled');
        btn.style.display = 'none';
      }
    });

    // Role-gate: show "Add Today's Task" button for Manager+
    if (ROLE_LEVEL[STATE.user.role] >= ROLE_LEVEL['Manager']) {
      const ttBtn = document.getElementById('btnAddTodayTask');
      if (ttBtn) ttBtn.style.display = '';
    }

    // Leader role: apply per-leader view restrictions after initial gating
    if (STATE.user.role === 'Leader') {
      _applyLeaderGating();
    }

    // Default view: dashboard if enabled, else first available
    if (STATE.modules.dashboard !== false) navigate('dashboard');
    else {
      const firstAvail = Array.from(document.querySelectorAll('.sidebar .nav-btn:not(.disabled)'))[0];
      if (firstAvail) navigate(firstAvail.getAttribute('data-view'));
    }
  }

  function _applyLeaderGating() {
    rpc('getMyLeaderAccess').then(r => {
      if (!r || !r.success) return;
      const allowed = new Set(r.views || []);
      // Never allow admin-only views regardless of config
      const NEVER_LEADER = new Set(['admin', 'control', 'leaderControl', 'audit']);
      document.querySelectorAll('.sidebar .nav-btn').forEach(btn => {
        const view = btn.getAttribute('data-view');
        if (!view) return;
        if (NEVER_LEADER.has(view)) {
          btn.classList.add('disabled');
          btn.style.display = 'none';
          return;
        }
        if (!allowed.has(view)) {
          btn.classList.add('disabled');
          btn.style.display = 'none';
        }
      });
      STATE.leaderViews = allowed;
    }).catch(() => { });
  }

  /* ── USER MENU ─────────────────────────────────────────────────── */
  function toggleUserMenu() {
    const btn = document.getElementById('userMenuBtn');
    const dd = document.getElementById('userDropdown');
    if (btn) btn.classList.toggle('open');
    if (dd) dd.classList.toggle('show');
  }

  // Close dropdown when clicking outside
  document.addEventListener('click', function (e) {
    const wrap = document.getElementById('userMenuWrap');
    if (wrap && !wrap.contains(e.target)) {
      const btn = document.getElementById('userMenuBtn');
      const dd = document.getElementById('userDropdown');
      if (btn) btn.classList.remove('open');
      if (dd) dd.classList.remove('show');
    }
  });

  function openProfileModal() {
    document.getElementById('profileEmail').textContent = STATE.user.email;
    document.getElementById('profileRole').textContent = STATE.user.role + (STATE.user.dept ? ' · ' + STATE.user.dept : '');
    document.getElementById('profileOldPwd').value = '';
    document.getElementById('profileNewPwd').value = '';
    document.getElementById('pwdMsg').textContent = '';
    document.getElementById('profileModal').style.display = 'flex';
  }

  function doLogout() {
    localStorage.removeItem('mis.email');
    localStorage.removeItem('mis.pwd');
    // clear properties service using rpc
    rpc('clearUserSession').then(() => {
      location.reload();
    }).catch(() => location.reload());
  }

  function submitPasswordChange() {
    const oldPwd = document.getElementById('profileOldPwd').value;
    const newPwd = document.getElementById('profileNewPwd').value;
    if (!oldPwd || !newPwd) {
      const msg = document.getElementById('pwdMsg');
      msg.textContent = 'Please enter both passwords.';
      msg.style.color = '#f87171';
      return;
    }
    const msg = document.getElementById('pwdMsg');
    msg.textContent = 'Updating...';
    msg.style.color = '#cbd5e1';
    rpc('changeUserPassword', oldPwd, newPwd).then(r => {
      if (r.success) {
        msg.textContent = 'Password updated successfully!';
        msg.style.color = '#4ade80';
        localStorage.setItem('mis.pwd', newPwd); // Update locally saved
        setTimeout(() => document.getElementById('profileModal').style.display = 'none', 1500);
      } else {
        msg.textContent = r.message || 'Failed to update';
        msg.style.color = '#f87171';
      }
    }).catch(e => {
      msg.textContent = String(e);
      msg.style.color = '#f87171';
    });
  }

  window.addEventListener('DOMContentLoaded', async () => {
    applyStoredTheme();
    setupWindowClosePush();

    const pl = document.getElementById('preloader');

    if (BOOT && BOOT.access) {
      // Already authenticated via Google Workspace!
      document.getElementById('login').style.display = 'none';
      bootApp();
      if (pl) { pl.classList.add('hide'); setTimeout(() => pl.remove(), 600); }
    } else {
      // Custom Auth path
      const savedEmail = localStorage.getItem('mis.email');
      const savedPwd = localStorage.getItem('mis.pwd');

      if (savedEmail && savedPwd) {
        try {
          const res = await rpc('authenticate', savedEmail, savedPwd);
          if (res.success) {
            updateStateFromBoot(res.data);
            document.getElementById('login').style.display = 'none';
            bootApp();
          } else {
            // Bad saved credentials, show login
            localStorage.removeItem('mis.pwd');
          }
        } catch (e) {
          // Network error maybe, show login
        }
      }

      // Hide preloader to reveal login screen (or app if auto-login worked)
      if (pl) { pl.classList.add('hide'); setTimeout(() => pl.remove(), 600); }
    }
  });

  /* ── THEME TOGGLE (Phase 5) ───────────────────────────────────── */
  function applyStoredTheme() {
    try {
      const t = localStorage.getItem('mis.theme');
      if (t === 'light') document.body.classList.add('light');
    } catch (e) { }
  }
  function toggleTheme() {
    document.body.classList.toggle('light');
    try { localStorage.setItem('mis.theme', document.body.classList.contains('light') ? 'light' : 'dark'); } catch (e) { }
  }

  /* ── BROWSER PUSH: 30 min before window closes (Phase 5) ──────── */
  function setupWindowClosePush() {
    if (!('Notification' in window)) return;
    if (!STATE.window || !STATE.window.end) return;
    if (Notification.permission === 'default') {
      // Defer asking until after first user interaction (browsers reject sync prompts).
      document.addEventListener('click', requestNotifPermissionOnce, { once: true });
    }
    scheduleWindowCloseNotification();
  }
  function requestNotifPermissionOnce() {
    try { Notification.requestPermission().then(scheduleWindowCloseNotification); } catch (e) { }
  }
  function scheduleWindowCloseNotification() {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const end = STATE.window && STATE.window.end;
    if (!end) return;
    // Compute today's "end - 30min" in local time.
    const [h, m] = end.split(':').map(n => parseInt(n, 10) || 0);
    const target = new Date();
    target.setHours(h, m - 30, 0, 0);
    const diffMs = target - new Date();
    if (diffMs <= 0) return; // already past
    if (diffMs > 12 * 60 * 60 * 1000) return; // sanity cap
    setTimeout(() => {
      try {
        new Notification('MIS Tracker — submission window closing', {
          body: 'Window closes at ' + end + '. Submit any pending entries.',
          tag: 'mis-window-close'
        });
      } catch (e) { }
    }, diffMs);
  }

  /* ── HELPERS ──────────────────────────────────────────────────── */
  function todayISO() { return STATE.today; }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function statusBadge(s) {
    const cls = (s || '').toLowerCase();
    if (cls === 'done' || cls === 'pending' || cls === 'skip') return '<span class="badge ' + cls + '">' + escapeHtml(s) + '</span>';
    return '<span class="badge">' + escapeHtml(s || '') + '</span>';
  }

  /* Skeleton placeholders — used wherever async content is loading. */
  function skeletonLines(n) {
    const widths = ['sk-w-90', 'sk-w-70', 'sk-w-50', 'sk-w-90', 'sk-w-30'];
    let h = '';
    for (let i = 0; i < (n || 3); i++) h += '<span class="sk sk-line ' + widths[i % widths.length] + '"></span>';
    return h;
  }
  function skeletonRows(n) {
    let h = '';
    for (let i = 0; i < (n || 3); i++) {
      h += '<div class="sk-row"><span class="sk"></span><span class="sk"></span><span class="sk sk-w-30"></span></div>';
    }
    return h;
  }

  /* Shared CSV cell escaper. */
  function csvCell(v) {
    if (v === null || v === undefined) return '';
    const s = String(v);
    if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  /* ── JsDashboard ──────────────────────────────────── */
  /* Phase 3: progressive dashboard load.
   * Sequence: stats → trend → report progress → pending.
   * Each RPC is independently cached server-side; client renders as soon as
   * each result arrives. Skeletons stay until that section's data lands. */

  function toggleDashCard(cardId, bodyId) {
    const body = document.getElementById(bodyId);
    const toggle = document.getElementById(bodyId + 'Toggle');
    if (!body) return;
    const hidden = body.style.display === 'none';
    body.style.display = hidden ? '' : 'none';
    if (toggle) toggle.textContent = hidden ? '▾' : '▸';
  }

  function loadDashboard() {
    // 1. Skeletons
    showKpiSkeleton();
    document.getElementById('roadsterTasks').innerHTML = skTable(3);
    document.getElementById('reportProgress').innerHTML = skTable(4);
    document.getElementById('weekTrend').innerHTML = skBars();
    document.getElementById('kanbanSummary').innerHTML = skKpiRow(4);
    document.getElementById('recentEntries').innerHTML = skTable(5);
    const tsEl = document.getElementById('taskSnapshot');
    if (tsEl) tsEl.innerHTML = skTable(1);

    // 2. Sequential progressive load (each call independent + cached)
    rpc('getTodayAlerts').then(r => { if (r && r.success) renderAlertBanners(r.alerts); });
    rpc('getDashStats')
      .then(r => { if (r.success) renderKpi(r.stats); else if (r.message) toast(r.message, 'error'); })
      .then(() => rpc('getRoadsterTasks'))
      .then(r => { if (r && r.success) renderRoadsterTasks(r.tasks); })
      .then(() => rpc('getDashWeekTrend'))
      .then(r => { if (r && r.success) renderWeekTrend(r.trend); })
      .then(() => rpc('getDashReportProgress'))
      .then(r => { if (r && r.success) renderReportProgress(r.progress); })
      .then(() => rpc('getDashPending'))
      .then(r => { if (r && r.success) { renderKanbanSummary(r.kanban); renderRecentEntries(r.recentEntries); } })
      .then(() => rpc('getTaskSnapshot'))
      .then(r => { if (r && r.success) renderTaskSnapshot(r.snapshot); })
      .catch(e => toast(String(e), 'error'));
  }

  function renderTaskSnapshot(tasks) {
    const el = document.getElementById('taskSnapshot');
    if (!el) return;
    if (!tasks || !tasks.length) { el.innerHTML = '<div class="empty">No tasks logged today.</div>'; return; }

    const priorityBadge = p => {
      const color = (p === 'High' || p === 'Urgent') ? '#dc2626' : (p === 'Low' ? '#64748b' : '#2563eb');
      return '<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:' + color + '22;color:' + color + ';border:1px solid ' + color + '44;">' + escapeHtml(p) + '</span>';
    };
    const statusBadgeClass = s => s === 'Done' ? 'roadster-toggle done' : (s === 'Skip' ? 'roadster-toggle' : 'roadster-toggle pending');
    const statusLabel = s => s === 'Done' ? '✅ Done' : (s === 'Skip' ? '⏭ Skip' : '⏳ Pending');

    const isManagerPlus = STATE.user && (STATE.user.role === 'Manager' || STATE.user.role === 'SuperAdmin');

    // Group by assignee for Manager+ view
    if (isManagerPlus && tasks.length > 1) {
      const groups = {};
      tasks.forEach(t => {
        const key = t.assignee || 'Unassigned';
        if (!groups[key]) groups[key] = [];
        groups[key].push(t);
      });

      let html = '';
      Object.keys(groups).sort().forEach(assignee => {
        const grpTasks = groups[assignee];
        const doneCount = grpTasks.filter(t => t.status === 'Done').length;
        html += '<div style="margin-bottom:10px;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:rgba(37,99,235,0.08);border-radius:8px;margin-bottom:4px;">' +
          '<span style="font-size:12px;font-weight:600;color:var(--accent);">' + escapeHtml(assignee) + '</span>' +
          '<span style="font-size:11px;color:var(--muted);">' + doneCount + '/' + grpTasks.length + ' done</span>' +
          '</div>';
        html += grpTasks.map(t =>
          '<div class="roadster-row">' +
          '<div class="roadster-info">' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
          '<span class="roadster-role">' + escapeHtml(t.name) + '</span>' +
          priorityBadge(t.priority) +
          '</div>' +
          (t.remarks ? '<span class="roadster-remark">' + escapeHtml(t.remarks) + '</span>' : '') +
          '</div>' +
          '<span class="' + statusBadgeClass(t.status) + '" style="pointer-events:none;">' + statusLabel(t.status) + '</span>' +
          '</div>'
        ).join('');
        html += '</div>';
      });
      el.innerHTML = html;
    } else {
      // Teammate view — flat list
      el.innerHTML = tasks.map(t =>
        '<div class="roadster-row">' +
        '<div class="roadster-info">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<span class="roadster-role">' + escapeHtml(t.name) + '</span>' +
        priorityBadge(t.priority) +
        '</div>' +
        (t.assignee ? '<span class="roadster-emp">' + escapeHtml(t.assignee) + '</span>' : '') +
        (t.remarks ? '<span class="roadster-remark">' + escapeHtml(t.remarks) + '</span>' : '') +
        '</div>' +
        '<span class="' + statusBadgeClass(t.status) + '" style="pointer-events:none;">' + statusLabel(t.status) + '</span>' +
        '</div>'
      ).join('');
    }
  }

  /* ── ALERT BANNERS ────────────────────────────────────────────── */
  function renderAlertBanners(alerts) {
    const area = document.getElementById('alertBannerArea');
    if (!area || !alerts || !alerts.length) return;
    const dismissed = JSON.parse(localStorage.getItem('dismissed_alerts') || '{}');
    const html = alerts
      .filter(a => !dismissed[a.alertId])
      .map(a =>
        '<div id="ab-' + a.alertId + '" style="background:#dc2626;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">' +
        '<div><strong>🔴 Urgent Task: ' + escapeHtml(a.taskName) + '</strong>' +
        (a.note ? '<div style="font-size:13px;margin-top:3px;opacity:0.9;">' + escapeHtml(a.note) + '</div>' : '') +
        '</div>' +
        '<button onclick="dismissAlert(\'' + a.alertId + '\')" style="background:transparent;border:1px solid rgba(255,255,255,0.6);color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:12px;white-space:nowrap;">Dismiss</button>' +
        '</div>'
      ).join('');
    area.innerHTML = html;
  }

  function dismissAlert(alertId) {
    const el = document.getElementById('ab-' + alertId);
    if (el) el.remove();
    const dismissed = JSON.parse(localStorage.getItem('dismissed_alerts') || '{}');
    dismissed[alertId] = true;
    localStorage.setItem('dismissed_alerts', JSON.stringify(dismissed));
  }

  /* ── SMART TASK ALERT MODAL ────────────────────────────────────── */
  const _ttState = { members: [] };

  function openTodayTaskModal() {
    document.getElementById('ttTaskName').value = '';
    document.getElementById('ttNote').value = '';
    document.getElementById('ttMsg').textContent = '';
    document.querySelector('input[name="ttPriority"][value="Normal"]').checked = true;
    document.querySelector('input[name="ttNotify"][value="none"]').checked = true;
    document.getElementById('ttSelectedWrap').style.display = 'none';
    document.getElementById('ttMemberList').innerHTML = '<span style="color:#94a3b8;font-size:13px;">Loading…</span>';
    document.getElementById('todayTaskModal').style.display = 'flex';

    // Wire up notify radios
    document.querySelectorAll('input[name="ttNotify"]').forEach(r => {
      r.onchange = function() {
        document.getElementById('ttSelectedWrap').style.display = this.value === 'selected' ? 'block' : 'none';
      };
    });

    // Load team members for "selected" option
    if (!_ttState.members.length) {
      rpc('getActiveTeamEmails').then(r => {
        if (r.success) {
          _ttState.members = r.data || [];
          _renderMemberList();
        }
      });
    } else {
      _renderMemberList();
    }
  }

  function _renderMemberList() {
    document.getElementById('ttMemberList').innerHTML = _ttState.members.map(m =>
      '<label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;">' +
      '<input type="checkbox" class="tt-member-cb" value="' + escapeHtml(m.email) + '"> ' +
      escapeHtml(m.name || m.email) + ' <span style="color:#64748b;font-size:11px;">(' + escapeHtml(m.email) + ')</span>' +
      '</label>'
    ).join('') || '<span style="color:#94a3b8;font-size:13px;">No team members found.</span>';
  }

  function closeTodayTaskModal() {
    document.getElementById('todayTaskModal').style.display = 'none';
  }

  function submitTodayTask() {
    const taskName = document.getElementById('ttTaskName').value.trim();
    if (!taskName) { document.getElementById('ttMsg').textContent = 'Task name is required.'; return; }

    const priority = document.querySelector('input[name="ttPriority"]:checked').value;
    const notify   = document.querySelector('input[name="ttNotify"]:checked').value;
    const selectedEmails = notify === 'selected'
      ? Array.from(document.querySelectorAll('.tt-member-cb:checked')).map(c => c.value)
      : [];

    const payload = {
      taskName,
      note:    document.getElementById('ttNote').value.trim(),
      priority,
      notify,
      selectedEmails
    };

    document.getElementById('ttMsg').textContent = 'Submitting…';
    rpc('addTodayTask', payload).then(r => {
      document.getElementById('ttMsg').textContent = '';
      if (r.success) {
        closeTodayTaskModal();
        const who = r.recipientCount > 0 ? ' · ' + r.recipientCount + ' notified' : '';
        toast('Task added' + who, 'success');
        rpc('getTaskSnapshot').then(r2 => { if (r2 && r2.success) renderTaskSnapshot(r2.snapshot); });
      } else {
        document.getElementById('ttMsg').textContent = r.message || 'Failed.';
      }
    }).catch(e => { document.getElementById('ttMsg').textContent = String(e); });
  }

  /* ── SKELETON HELPERS ─────────────────────────────────────────── */
  function showKpiSkeleton() {
    ['kpiTotal', 'kpiDone', 'kpiPending'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '<span class="sk" style="display:inline-block; width:40px; height:24px;"></span>';
    });
  }
  function skTable(rows) {
    let h = '<div>';
    for (let i = 0; i < rows; i++) {

  // Draft persistence: serialize the form to localStorage on every change,
  // restore on render. Drafts cleared after a successful submit.
  const DRAFT_KEYS = { mis: 'mis.draft', du: 'du.draft', task: 'task.draft' };

  function saveDraft(form) {
    try {
      if (form === 'mis') {
        const rows = Array.from(document.querySelectorAll('#misComponents .entry-row')).map(row => ({
          component: row.querySelector('.mis-component').value,
          status: row.querySelector('.mis-status').value,
          remarks: row.querySelector('.mis-remarks').value
        }));
        localStorage.setItem(DRAFT_KEYS.mis, JSON.stringify({
          report: document.getElementById('misReport').value,
          rows
        }));
      } else if (form === 'du') {
        const rows = Array.from(document.querySelectorAll('#duFactors .entry-row')).map(row => ({
          factor: row.querySelector('.du-factor').value,
          status: row.querySelector('.du-status').value,
          mode: row.querySelector('.du-mode').value,
          remarks: row.querySelector('.du-remarks').value
        }));
        localStorage.setItem(DRAFT_KEYS.du, JSON.stringify({
          commodity: document.getElementById('duCommodity').value,
          type: document.getElementById('duType').value,
          rows
        }));
      } else if (form === 'task') {
        const rows = Array.from(document.querySelectorAll('#taskList .entry-row')).map(row => ({
          name: row.querySelector('.task-name').value,
          status: row.querySelector('.task-status').value,
          remarks: row.querySelector('.task-remarks').value
        }));
        localStorage.setItem(DRAFT_KEYS.task, JSON.stringify({ rows }));
      }
    } catch (e) { }
  }

  function restoreDraft(form) {
    try {
      if (form === 'mis') {
        const raw = localStorage.getItem(DRAFT_KEYS.mis);
        if (!raw) return;
        const d = JSON.parse(raw);
        const map = {}; (d.rows || []).forEach(r => { map[r.component] = r; });
        let restored = 0;
        document.querySelectorAll('#misComponents .entry-row').forEach(row => {
          const c = row.querySelector('.mis-component').value;
          if (map[c]) {
            row.querySelector('.mis-status').value = map[c].status || 'Pending';
            row.querySelector('.mis-remarks').value = map[c].remarks || '';
            restored++;
          }
        });
        if (restored) toast('Draft restored (' + restored + ' rows)', 'success');
      } else if (form === 'du') {
        const raw = localStorage.getItem(DRAFT_KEYS.du);
        if (!raw) return;
        const d = JSON.parse(raw);
        const map = {}; (d.rows || []).forEach(r => { map[r.factor] = r; });
        let restored = 0;
        document.querySelectorAll('#duFactors .entry-row').forEach(row => {
          const f = row.querySelector('.du-factor').value;
          if (map[f]) {
            row.querySelector('.du-status').value = map[f].status || 'Pending';
            row.querySelector('.du-mode').value = map[f].mode || '';
            row.querySelector('.du-remarks').value = map[f].remarks || '';
            restored++;
          }
        });
        if (restored) toast('Draft restored (' + restored + ' rows)', 'success');
      } else if (form === 'task') {
        const raw = localStorage.getItem(DRAFT_KEYS.task);
        if (!raw) return;
        const d = JSON.parse(raw);
        const map = {}; (d.rows || []).forEach(r => { map[r.name] = r; });
        let restored = 0;
        document.querySelectorAll('#taskList .entry-row').forEach(row => {
          const n = row.querySelector('.task-name').value;
          if (map[n]) {
            row.querySelector('.task-status').value = map[n].status || 'Pending';
            row.querySelector('.task-remarks').value = map[n].remarks || '';
            restored++;
          }
        });
        if (restored) toast('Draft restored (' + restored + ' rows)', 'success');
      }
    } catch (e) { }
  }

  function clearDraft(form) {
    try { localStorage.removeItem(DRAFT_KEYS[form]); } catch (e) { }
  }

  // Auto-save on any change inside the entry containers.
  document.addEventListener('change', e => {
    const t = e.target;
    if (!t.closest) return;
    if (t.closest('#misComponents')) saveDraft('mis');
    else if (t.closest('#duFactors')) saveDraft('du');
    else if (t.closest('#taskList')) saveDraft('task');
  });

  /* ── KEYBOARD SHORTCUTS (D / P / S) ───────────────────────────── */
  // While a status select inside any form is focused, single-letter keys cycle
  // the value. Skipped when the user is typing in a text/textarea field.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (!t || !t.tagName) return;

    // Only act when focus is on a status select, OR a text input inside an entry-row.
    let statusSel = null;
    if (t.matches && t.matches('select.mis-status, select.du-status, select.task-status')) statusSel = t;
    else if (t.matches && (t.matches('input.mis-remarks, input.du-mode, input.du-remarks, input.task-remarks'))) {
      // Allow typing in text fields without intercepting normal letters.
      return;
    }
    if (!statusSel) return;

    const key = (e.key || '').toLowerCase();
    let next = null;
    if (key === 'd') next = 'Done';
    else if (key === 'p') next = 'Pending';
    else if (key === 's') next = 'Skip';
    if (!next) return;
    e.preventDefault();
    statusSel.value = next;
    statusSel.dispatchEvent(new Event('change', { bubbles: true }));
  });

  function openAdhocModal() {

  function submitAdhocTask() {
    const freq = document.getElementById('adhocFreq').value;
    const name = (document.getElementById('adhocName').value || '').trim();
    const dueDate = (document.getElementById('adhocDueDate') || {}).value || '';
    if (!name) { toast('Task name is required', 'error'); return; }

    const btn = document.querySelector('#adhocModal .primary');
    if (btn) btn.disabled = true;

    rpc('addAdhocTask', { freq, name, dueDate }).then(r => {
      if (btn) btn.disabled = false;
      if (!r || !r.success) { toast((r && r.message) || 'Failed to add task', 'error'); return; }
      closeAdhocModal();
      loadTaskForm();
      toast('Task "' + name + '" added to ' + freq + ' list', 'success');
    }).catch(e => {
      if (btn) btn.disabled = false;
      toast(String(e), 'error');
    });
  }

  function loadTaskForm() {
    TASK_OPEN_TIME = Date.now();

    // Show skeletons in all sections
    TASK_SECTIONS.forEach(freq => {
      const el = document.getElementById('task' + freq + 'List');
      if (el) el.innerHTML = skeletonRows(3);
    });

    rpc('getTaskList').then(result => {
      // result can be flat array (legacy) or { dailyTasks, weeklyTasks, monthlyTasks }
      let daily, weekly, monthly;
      if (Array.isArray(result)) {
        // Legacy: all tasks are daily
        daily = result;
        weekly = [];
        monthly = [];
      } else {
        daily = result.dailyTasks || [];
        weekly = result.weeklyTasks || [];
        monthly = result.monthlyTasks || [];
      }

      renderTaskSection('Daily', daily);
      renderTaskSection('Weekly', weekly);
      renderTaskSection('Monthly', monthly);
    }).catch(e => toast(String(e), 'error'));
  }


  function renderTaskSection(freq, tasks) {
    const el = document.getElementById('task' + freq + 'List');
    const countEl = document.getElementById('task' + freq + 'Count');
    if (!el) return;

    if (countEl) countEl.textContent = tasks.length;

    if (!tasks.length) {
      el.innerHTML = '<div class="empty" style="padding:14px;">No ' + freq.toLowerCase() + ' tasks configured.</div>';
      return;
    }

    el.innerHTML = tasks.map((t, i) => {
      const statusClass = t.lastStatus === 'Done' ? 'task-status-done' :
        t.lastStatus === 'Skip' ? 'task-status-skip' : '';
      const isOverdue = t.dueDate && t.dueDate < STATE.today && t.lastStatus !== 'Done';
      const dueBadge = t.dueDate
        ? '<span class="task-due-badge' + (isOverdue ? ' overdue' : '') + '">Due ' + escapeHtml(t.dueDate) + '</span>'
        : '';
      return '<div class="task-entry-row ' + statusClass + '" data-i="' + i + '" data-freq="' + freq + '">' +
        '<div class="task-entry-info">' +
        '<div class="task-entry-name">' + escapeHtml(t.name) + dueBadge + '</div>' +
        '<div class="task-entry-meta">' + escapeHtml(t.assignee || '') + (t.priority ? ' · ' + escapeHtml(t.priority) : '') + '</div>' +
        '</div>' +
        '<select class="task-status">' +
        '<option value="Pending"' + (t.lastStatus === 'Pending' || !t.lastStatus ? ' selected' : '') + '>Pending</option>' +
        '<option value="Done"' + (t.lastStatus === 'Done' ? ' selected' : '') + '>Done</option>' +
        '<option value="Skip"' + (t.lastStatus === 'Skip' ? ' selected' : '') + '>Skip</option>' +
        '</select>' +
        '<input type="text" class="task-remarks" placeholder="remarks" value="' + escapeHtml(t.lastRemarks || '') + '">' +
        '<input type="hidden" class="task-name" value="' + escapeHtml(t.name) + '">' +
        '<input type="hidden" class="task-priority" value="' + escapeHtml(t.priority || '') + '">' +
        '<input type="hidden" class="task-assignee" value="' + escapeHtml(t.assignee || '') + '">' +
        '<input type="hidden" class="task-frequency" value="' + freq + '">' +
        '</div>';
    }).join('');
  }

  function toggleTaskSection(freq) {
    const body = document.getElementById('task' + freq + 'List');
    const toggle = document.getElementById('task' + freq + 'Toggle');
    if (!body) return;

    if (TASK_COLLAPSED.has(freq)) {
      TASK_COLLAPSED.delete(freq);
      body.style.display = '';
      if (toggle) toggle.textContent = '▾';
    } else {
      TASK_COLLAPSED.add(freq);
      body.style.display = 'none';
      if (toggle) toggle.textContent = '▸';
    }
  }

  function quickAllDoneSection(freq) {
    const rows = document.querySelectorAll('#task' + freq + 'List .task-entry-row');
    rows.forEach(row => {
      const sel = row.querySelector('.task-status');
      if (sel) sel.value = 'Done';
      row.classList.add('task-status-done');
      row.classList.remove('task-status-skip');
    });
    toast(freq + ' tasks marked Done', 'success');
  }

  function submitAllTasks() {
    const date = todayISO();
    const onBehalfOf = '';
    const confidence = 'Medium';

    const allTasks = [];
    TASK_SECTIONS.forEach(freq => {
      const rows = document.querySelectorAll('#task' + freq + 'List .task-entry-row');
      rows.forEach(row => {
        allTasks.push({
          name: row.querySelector('.task-name').value,
          priority: row.querySelector('.task-priority').value,
          assignee: row.querySelector('.task-assignee').value,
          status: row.querySelector('.task-status').value,
          remarks: row.querySelector('.task-remarks').value,
          frequency: freq
        });
      });
    });

    if (!allTasks.length) { toast('Nothing to submit', 'error'); return; }

    document.getElementById('taskMsg').textContent = 'Submitting…';
    rpc('submitTaskEntries', {
      date, tasks: allTasks, confidence,
      onBehalfOfEmail: onBehalfOf, formOpenTime: TASK_OPEN_TIME
    }).then(r => {
      document.getElementById('taskMsg').textContent = '';
      if (r.success) { clearDraft('task'); toast(r.message, 'success'); loadTaskForm(); }
      else toast(r.message || 'Failed', 'error');
    }).catch(e => { document.getElementById('taskMsg').textContent = ''; toast(String(e), 'error'); });
  }

  // Keep legacy function reference for backward compatibility
  function submitTaskEntries_client() { submitAllTasks(); }

  /* ── JsRoadster ──────────────────────────────────── */
  /* ── DAILY ROADSTER VIEW ─────────────────────────────────────── */
  const RKSTATE = { tasks: [] };

  function loadRoadster() {
    document.getElementById('rkTotal').innerHTML = '<span class="sk" style="display:inline-block;width:30px;height:20px;"></span>';
    document.getElementById('rkDone').innerHTML = '<span class="sk" style="display:inline-block;width:30px;height:20px;"></span>';
    document.getElementById('rkPending').innerHTML = '<span class="sk" style="display:inline-block;width:30px;height:20px;"></span>';
    document.getElementById('roadsterViewList').innerHTML = viewLoaderHtml('Loading roster…');

    rpc('getRoadsterTasks').then(r => {
      if (!r.success) { toast(r.message || 'Failed', 'error'); return; }
      RKSTATE.tasks = r.tasks || [];
      renderRoadsterKpi();
      renderRoadsterView();
    }).catch(e => toast(String(e), 'error'));
  }

  function renderRoadsterKpi() {
    const total = RKSTATE.tasks.length;
    const done = RKSTATE.tasks.filter(t => t.status === 'Done').length;
    const pending = total - done;
    document.getElementById('rkTotal').textContent = total;
    document.getElementById('rkDone').textContent = done;
    document.getElementById('rkPending').textContent = pending;
  }

  function renderRoadsterView() {
    const statusFilter = document.getElementById('rkFilter').value;
    const freqFilter = document.getElementById('rkFreqFilter').value;
    let list = RKSTATE.tasks;

    if (statusFilter === 'pending') list = list.filter(t => t.status !== 'Done');
    else if (statusFilter === 'done') list = list.filter(t => t.status === 'Done');

    if (freqFilter !== 'all') list = list.filter(t => t.frequency === freqFilter);

    const el = document.getElementById('roadsterViewList');
    if (!list.length) {
      el.innerHTML = '<div class="empty">No matching Daily Roster tasks.</div>';
      return;
    }

    el.innerHTML = list.map(t => {
      const isDone = t.status === 'Done';
      const btnClass = isDone ? 'roadster-toggle done' : 'roadster-toggle pending';
      const btnLabel = isDone ? '✅ Done' : '⏳ Pending';
      const nextStatus = isDone ? 'Pending' : 'Done';
      const freqBadge = '<span class="roadster-freq">' + escapeHtml(t.frequency || 'Daily') + '</span>';
      const remarkHtml = t.remark ? '<span class="roadster-remark">' + escapeHtml(t.remark) + '</span>' : '';
      return '<div class="roadster-row" data-role="' + escapeHtml(t.role) + '">' +
        '<div class="roadster-info">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<span class="roadster-role">' + escapeHtml(t.role) + '</span>' +
        freqBadge +
        '</div>' +
        '<span class="roadster-emp">' + escapeHtml(t.employee) + '</span>' +
        remarkHtml +
        '</div>' +
        '<button class="' + btnClass + '" onclick="rkToggle(\'' + escapeHtml(t.role) + '\', \'' + nextStatus + '\')">' + btnLabel + '</button>' +
        '</div>';
    }).join('');
  }

  function rkToggle(role, newStatus) {
    var t = RKSTATE.tasks.find(function (x) { return x.role === role; });
    if (t) t.status = newStatus;
    renderRoadsterKpi();
    renderRoadsterView();

    rpc('updateRoadsterStatus', role, newStatus).then(r => {
      if (r.success) {
        toast('Daily Roster: ' + role + ' → ' + newStatus, 'success');
      } else {
        toast(r.message || 'Update failed', 'error');
        loadRoadster();
      }
    }).catch(e => { toast(String(e), 'error'); loadRoadster(); });
  }

  /* ── JsKanban ──────────────────────────────────── */
  const KSTATE = {
    shell: null,
    byStatus: {},        // status -> [tasks]
    allTasks: [],        // flat list across columns (for client-side search)
    collapsed: new Set(),
    selected: new Set(),
    dragId: null,
    pending: null       // { ids: [], targetStatus, kind: 'drag' | 'bulk' } awaiting block-reason
  };
  const KCOLS = ['Assigned', 'In Progress', 'Under Review', 'Done', 'Blocked'];

  /* ── BOOT: shell first, then parallel per-column loads ─────────── */
  function loadKanban() {
    // Render headers + skeleton cards immediately, before any RPC.
    renderKanbanShell();

    rpc('getKanbanShell').then(s => {
      if (!s.success) { toast(s.message || 'Kanban failed', 'error'); return; }
      KSTATE.shell = s;
      populateFilters(s);
      renderVelocity(s.sprintVelocity);
      fillSkeletonCounts(s.counts);
      // Now fetch each column independently. Cards stream in column-by-column.
      KCOLS.forEach((col, i) => loadKanbanColumn(col, i));
    }).catch(e => toast(String(e), 'error'));
  }

  function renderKanbanShell() {
    const board = document.getElementById('kanbanBoard');
    board.innerHTML = '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px;">' +
      KCOLS.map(col =>
        '<div class="kcol" data-status="' + col + '" id="kcol-' + cssId(col) + '" ondragover="kAllowDrop(event)" ondrop="kDrop(event)">' +
        '<div class="kcol-header" onclick="kToggleCollapse(\'' + cssId(col) + '\')">' +
        '<h4>' + col + ' <span class="kcount" id="kcount-' + cssId(col) + '">…</span></h4>' +
        '<button class="kcol-toggle" onclick="event.stopPropagation(); kToggleCollapse(\'' + cssId(col) + '\')">▾</button>' +
        '</div>' +
        '<div class="kcards" id="kcards-' + cssId(col) + '">' + skeletonCards(3) + '</div>' +
        '</div>'
      ).join('') + '</div>';
  }

  function fillSkeletonCounts(counts) {
    KCOLS.forEach(col => {
      const el = document.getElementById('kcount-' + cssId(col));
      if (el) el.textContent = '(' + (counts[col] || 0) + ')';
    });
  }

  function loadKanbanColumn(status) {
    rpc('getKanbanColumn', status).then(r => {
      if (!r.success) { toast(r.message || ('Column ' + status + ' failed'), 'error'); return; }
      KSTATE.byStatus[status] = r.tasks || [];
      KSTATE.allTasks = KCOLS.reduce((acc, c) => acc.concat(KSTATE.byStatus[c] || []), []);
      renderColumn(status);
    }).catch(e => toast(String(e), 'error'));
  }

  function populateFilters(shell) {
    // Assignee filter (board toolbar)
    const as = document.getElementById('kAssignee');
    if (as) {
      const cur = as.value;
      as.innerHTML = '<option value="">All</option>' +
        (shell.assignees || []).map(e => '<option value="' + escapeHtml(e) + '">' + escapeHtml(e) + '</option>').join('');
      as.value = cur || '';
    }

    // Modal assignee checkboxes — shell.allUsers already contains lowercased emails.
    const mAssignee = document.getElementById('kAssigneeField');
    if (mAssignee && shell.allUsers) {
      mAssignee.innerHTML = shell.allUsers.map(u =>
        '<label class="kassignee-item" title="' + escapeHtml(u.email) + '">' +
        '<input type="checkbox" class="modal-assignee-cb" value="' + escapeHtml(String(u.email).toLowerCase()) + '">' +
        '<span>' + escapeHtml(u.name || u.email) + '</span>' +
        '</label>'
      ).join('');
    }
  }

  function renderVelocity(v) {
    // Sprint workflow is hidden in the new task UI. Always hide the bar.
    const el = document.getElementById('kVelocity');
    if (el) el.style.display = 'none';
  }

  /* ── RENDER ────────────────────────────────────────────────────── */
  function applyKanbanFilter(tasks) {
    const qEl = document.getElementById('kSearch');
    const assEl = document.getElementById('kAssignee');
    const dueEl = document.getElementById('kDueFilter');
    const q = qEl ? qEl.value.toLowerCase().trim() : '';
    const ass = assEl ? assEl.value.toLowerCase() : '';
    const due = dueEl ? dueEl.value : '';
    const today = STATE.today;
    const in7 = ymdAddDays(today, 7);
    return tasks.filter(t => {
      if (q) {
        const hay = (t.title + ' ' + (t.desc || '') + ' ' + (t.remark || '')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (ass) {
        const list = (t.assignedToList && t.assignedToList.length)
          ? t.assignedToList
          : String(t.assignedTo || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
        if (list.indexOf(ass) === -1) return false;
      }
      if (due === 'overdue' && !(t.dueDate && t.dueDate < today && t.status !== 'Done')) return false;
      if (due === 'today' && t.dueDate !== today) return false;
      if (due === 'week' && !(t.dueDate && t.dueDate >= today && t.dueDate <= in7)) return false;
      return true;
    });
  }

  function renderKanban() {
    KCOLS.forEach(renderColumn);
  }

  function renderColumn(status) {
    const tasks = KSTATE.byStatus[status];
    const container = document.getElementById('kcards-' + cssId(status));
    const countEl = document.getElementById('kcount-' + cssId(status));
    if (!container) return;
    if (!tasks) { container.innerHTML = skeletonCards(2); return; }

    const filtered = applyKanbanFilter(tasks);
    countEl.textContent = '(' + filtered.length + ')';

    if (!filtered.length) { container.innerHTML = '<div class="kcol-empty">No tasks here</div>'; return; }

    container.innerHTML = filtered.map(t => kanbanCardHtml(t)).join('');
  }

  function kanbanCardHtml(t) {
    const overdue = t.dueDate && t.dueDate < STATE.today && t.status !== 'Done';
    const isBlocked = t.status === 'Blocked';
    const cardStyle = overdue
      ? ' style="background:#2d1a1a; border-left:3px solid #f87171;"'
      : '';

    // Priority dot color
    const prio = (t.priority || 'Medium').toLowerCase();
    const prioDot = prio === 'high' ? '#f87171' : prio === 'low' ? '#60a5fa' : '#fbbf24';

    // Assignee avatars
    const list = (t.assignedToNameList && t.assignedToNameList.length)
      ? t.assignedToNameList
      : (t.assignedToName || t.assignedTo || '').split(',').map(s => s.trim()).filter(Boolean);
    const avatarHtml = list.slice(0, 3).map(n => {
      const parts = String(n).split(/\s+/).filter(Boolean);
      const ini = (parts[0] ? parts[0][0] : '?').toUpperCase();
      return '<span class="kavatar" title="' + escapeHtml(n) + '">' + escapeHtml(ini) + '</span>';
    }).join('');
    const nameHtml = list.length ? '<span class="kassignee-name">' + escapeHtml(list[0]) + (list.length > 1 ? ' +' + (list.length - 1) : '') + '</span>' : '';

    // Factor tag
    const factorTag = t.factor ? '<span class="kfactor-tag">' + escapeHtml(t.factor) + '</span>' : '';

    // Description (truncated)
    const desc = t.desc ? '<div class="kdesc">' + escapeHtml(t.desc.length > 80 ? t.desc.substring(0, 80) + '…' : t.desc) + '</div>' : '';

    // Due date
    const dueHtml = t.dueDate
      ? '<div class="kdue' + (overdue ? ' overdue' : '') + '">Due ' + escapeHtml(t.dueDate) + '</div>'
      : '';

    // Blocked reason banner
    const blockedBanner = (isBlocked && t.blockedReason)
      ? '<div class="kblocked-banner">Blocked: ' + escapeHtml(t.blockedReason) + '</div>'
      : '';

    // Comment count (conversation indicator)
    const commentCount = (t.comments && t.comments.length) || 0;

    const canEdit = STATE.user && (STATE.user.role === 'Manager' || STATE.user.role === 'SuperAdmin');

    return '<div class="kcard-v2"' + cardStyle + ' data-id="' + escapeHtml(t.id) + '" draggable="true" ondragstart="kDragStart(event)">' +
      blockedBanner +
      '<div class="kcard-top">' +
      '<div class="kcard-title-row">' +
      '<span class="kprio-dot" style="background:' + prioDot + ';"></span>' +
      '<span class="kcard-title">' + escapeHtml(t.title) + '</span>' +
      '</div>' +
      '</div>' +
      desc +
      (factorTag ? '<div class="kcard-tags">' + factorTag + '</div>' : '') +
      dueHtml +
      '<div class="kcard-divider"></div>' +
      '<div class="kcard-assignee-row">' +
      '<div class="kcard-avatar-group">' + avatarHtml + nameHtml + '</div>' +
      '<div class="kcard-remark-count" title="Remarks">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>' +
      '<span>' + commentCount + '</span>' +
      '</div>' +
      '</div>' +
      '<div class="kcard-actions-v2">' +
      '<select class="kinline-status" onchange="kInlineStatus(\'' + escapeHtml(t.id) + '\', this.value)" onclick="event.stopPropagation()">' +
      KCOLS.map(c => '<option' + (c === t.status ? ' selected' : '') + '>' + c + '</option>').join('') +
      '</select>' +
      '<div class="kcard-btns">' +
      '<button class="kbtn-icon" title="Conversation" onclick="event.stopPropagation(); openCommentModal(\'' + escapeHtml(t.id) + '\')">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>' +
      '</button>' +
      (canEdit ? '<button class="kbtn-icon" title="Edit" onclick="event.stopPropagation(); openKanbanEdit(\'' + escapeHtml(t.id) + '\')">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
        '</button>' : '') +
      (canEdit ? '<button class="kbtn-icon kbtn-danger" title="Delete" onclick="event.stopPropagation(); kQuickDelete(\'' + escapeHtml(t.id) + '\')">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>' +
        '</button>' : '') +
      '</div>' +
      '</div>' +
      '</div>';
  }

  function skeletonCards(n) {
    let h = '';
    for (let i = 0; i < n; i++) {
      h += '<div class="sk-card"><span class="sk sk-title"></span><span class="sk sk-meta"></span></div>';
    }
    return h;
  }

  function cssId(s) { return String(s).replace(/[^A-Za-z0-9]/g, '_'); }

  function ymdAddDays(ymd, days) {
    const d = new Date(ymd + 'T00:00:00');
    d.setDate(d.getDate() + days);
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + dd;
  }

  /* ── COLLAPSE / EXPAND ─────────────────────────────────────────── */
  function kToggleCollapse(colId) {
    const el = document.getElementById('kcol-' + colId);
    if (!el) return;
    el.classList.toggle('collapsed');
    const btn = el.querySelector('.kcol-toggle');
    if (btn) btn.textContent = el.classList.contains('collapsed') ? '▸' : '▾';
  }

  /* ── SELECTION ─────────────────────────────────────────────────── */
  function kToggleSelect(id, checked) {
    if (checked) KSTATE.selected.add(id);
    else KSTATE.selected.delete(id);
    refreshBulkBar();
    // Re-render only the affected card's container is heavy; just update class
    document.querySelectorAll('.kcard[data-id="' + cssEsc(id) + '"]').forEach(el => {
      if (checked) el.classList.add('selected'); else el.classList.remove('selected');
    });
  }
  function cssEsc(s) { return String(s).replace(/"/g, '\\"'); }

  function refreshBulkBar() {
    const bar = document.getElementById('kBulkBar');
    if (!KSTATE.selected.size) { bar.style.display = 'none'; return; }
    bar.style.display = '';
    document.getElementById('kBulkCount').textContent = KSTATE.selected.size + ' selected';
  }

  function kClearSelection() {
    KSTATE.selected.clear();
    refreshBulkBar();
    renderKanban();
  }

  function kBulkApply() {
    const target = document.getElementById('kBulkTarget').value;
    if (!target) { toast('Pick a target column', 'error'); return; }
    const ids = Array.from(KSTATE.selected);
    if (!ids.length) return;

    if (target === 'Blocked') {
      KSTATE.pending = { ids, targetStatus: 'Blocked', kind: 'bulk' };
      openBlockedReasonModal();
      return;
    }
    performBulkMove(ids, target, '');
  }

  function performBulkMove(ids, status, blockedReason) {
    document.getElementById('kBulkMsg').textContent = 'Moving…';
    rpc('bulkMoveKanban', ids, status, blockedReason).then(r => {
      document.getElementById('kBulkMsg').textContent = '';
      if (r.success) {
        toast('Moved ' + r.moved + (r.skipped && r.skipped.length ? ' · ' + r.skipped.length + ' skipped' : ''), 'success');
        if (r.skipped && r.skipped.length) {
          console.warn('Bulk move skipped:', r.skipped);
        }
        KSTATE.selected.clear();
        refreshBulkBar();
        loadKanban();
      } else toast(r.message || 'Failed', 'error');
    }).catch(e => { document.getElementById('kBulkMsg').textContent = ''; toast(String(e), 'error'); });
  }

  /* ── DRAG / DROP (optimistic) ──────────────────────────────────── */
  function kDragStart(e) { KSTATE.dragId = e.currentTarget.getAttribute('data-id'); }
  function kAllowDrop(e) { e.preventDefault(); }
  function kDrop(e) {
    e.preventDefault();
    const newStatus = e.currentTarget.getAttribute('data-status');
    const id = KSTATE.dragId;
    if (!id) return;

    if (newStatus === 'Blocked') {
      KSTATE.pending = { ids: [id], targetStatus: 'Blocked', kind: 'drag' };
      openBlockedReasonModal();
      return;
    }
    applyOptimisticMove([id], newStatus);
    performMove(id, newStatus, '');
  }

  function applyOptimisticMove(ids, newStatus) {
    const set = new Set(ids);
    let moved = [];
    Object.keys(KSTATE.byStatus).forEach(status => {
      KSTATE.byStatus[status] = (KSTATE.byStatus[status] || []).filter(t => {
        if (!set.has(t.id)) return true;
        moved.push(Object.assign({}, t, { status: newStatus }));
        return false;
      });
    });
    KSTATE.byStatus[newStatus] = (KSTATE.byStatus[newStatus] || []).concat(moved);
    renderKanban();
  }

  function performMove(id, newStatus, blockedReason) {
    rpc('updateKanbanTask', { id, status: newStatus, blockedReason }).then(r => {
      if (!r.success) {
        toast(r.message || 'Update failed — reverting', 'error');
        loadKanban();
        return;
      }
      if (Array.isArray(r.warnings)) r.warnings.forEach(w => toast(w, 'error'));
    }).catch(err => { toast(String(err), 'error'); loadKanban(); });
  }

  /* ── INLINE STATUS CHANGE ──────────────────────────────────────── */
  function kInlineStatus(id, newStatus) {
    if (newStatus === 'Blocked') {
      KSTATE.pending = { ids: [id], targetStatus: 'Blocked', kind: 'drag' };
      openBlockedReasonModal();
      return;
    }
    applyOptimisticMove([id], newStatus);
    performMove(id, newStatus, '');
  }

  /* ── BLOCKED REASON MODAL ──────────────────────────────────────── */
  function openBlockedReasonModal() {
    document.getElementById('kBlockReason').value = '';
    document.getElementById('kBlockModal').style.display = 'flex';
    setTimeout(() => document.getElementById('kBlockReason').focus(), 50);
  }

  function kBlockModalConfirm() {
    const reason = document.getElementById('kBlockReason').value.trim();
    if (!reason) { toast('Reason required', 'error'); return; }
    const p = KSTATE.pending; KSTATE.pending = null;
    document.getElementById('kBlockModal').style.display = 'none';
    if (!p) return;
    if (p.kind === 'bulk') {
      performBulkMove(p.ids, p.targetStatus, reason);
    } else {
      applyOptimisticMove(p.ids, p.targetStatus);
      performMove(p.ids[0], p.targetStatus, reason);
    }
  }

  function kBlockModalCancel() {
    KSTATE.pending = null;
    document.getElementById('kBlockModal').style.display = 'none';
    loadKanban();

  function openKanbanCreate() {
    kEditingId = null;
    document.getElementById('kModalTitle').textContent = 'New Task';
    document.getElementById('kTitle').value = '';
    document.getElementById('kDesc').value = '';
    document.getElementById('kFactor').value = '';
    document.getElementById('kPriority').value = 'Medium';
    document.getElementById('kDue').value = '';
    document.getElementById('kRemark').value = '';
    // Pre-tick the current user.
    const me = (STATE.user && STATE.user.email || '').toLowerCase();
    document.querySelectorAll('.modal-assignee-cb').forEach(cb => cb.checked = (cb.value === me));

    document.getElementById('kMetaChips').style.display = 'none';

    document.getElementById('kDeleteBtn').style.display = 'none';
    document.getElementById('kModal').style.display = 'flex';

  function openKanbanEdit(id) {
    const t = KSTATE.allTasks.find(x => x.id === id);
    if (!t) return;
    kEditingId = id;
    document.getElementById('kModalTitle').textContent = 'Edit Task';
    document.getElementById('kTitle').value = t.title || '';
    document.getElementById('kDesc').value = t.desc || '';
    document.getElementById('kFactor').value = t.factor || '';
    document.getElementById('kPriority').value = t.priority || 'Medium';
    document.getElementById('kDue').value = t.dueDate || '';
    document.getElementById('kRemark').value = t.remark || '';

    const assigned = (t.assignedToList && t.assignedToList.length
      ? t.assignedToList
      : String(t.assignedTo || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean));
    document.querySelectorAll('.modal-assignee-cb').forEach(cb =>
      cb.checked = assigned.indexOf(String(cb.value).toLowerCase()) !== -1);

    // Read-only chips
    document.getElementById('kMetaChips').style.display = 'flex';
    document.getElementById('kChipId').textContent = t.id;
    const created = (t.createdAt && !/^01-Jan-70/.test(t.createdAt)) ? t.createdAt : '—';
    document.getElementById('kChipCreated').textContent = created;
    document.getElementById('kChipStatus').textContent = t.status || '—';

    const canEdit = _kIsManagerPlus();
    document.getElementById('kSaveBtn').textContent = 'Save';
    document.getElementById('kDeleteBtn').style.display = canEdit ? 'inline-block' : 'none';
    document.getElementById('kModal').style.display = 'flex';
  }

  function closeKanbanModal() { document.getElementById('kModal').style.display = 'none'; }

  function submitKanbanCreate() {
    const assignedTo = Array.from(document.querySelectorAll('.modal-assignee-cb:checked'))
      .map(cb => String(cb.value).toLowerCase().trim())
      .filter(Boolean);

    const payload = {
      title: document.getElementById('kTitle').value.trim(),
      desc: document.getElementById('kDesc').value.trim(),
      factor: document.getElementById('kFactor').value.trim(),
      priority: document.getElementById('kPriority').value,
      assignedTo: assignedTo,
      dueDate: document.getElementById('kDue').value,
      remark: document.getElementById('kRemark').value.trim()
    };
    if (!payload.title) { toast('Task name required', 'error'); return; }
    if (!assignedTo.length) { toast('Pick at least one assignee', 'error'); return; }

    const fn = kEditingId ? 'updateKanbanTask' : 'createKanbanTask';
    if (kEditingId) payload.id = kEditingId;

    const btn = document.getElementById('kSaveBtn');
    btn.disabled = true;
    rpc(fn, payload).then(r => {
      btn.disabled = false;
      if (!r.success) { toast(r.message || 'Failed', 'error'); return; }
      if (Array.isArray(r.warnings)) r.warnings.forEach(w => toast(w, 'error'));
      toast(kEditingId ? 'Task updated' : (assignedTo.length > 1 ? assignedTo.length + ' tasks created' : 'Task created'), 'success');
      closeKanbanModal();
      loadKanban();
    }).catch(e => { btn.disabled = false; toast(String(e), 'error'); });
  }

  function kDelete() {
    if (!kEditingId || !confirm('Delete this task?')) return;
    rpc('deleteKanbanTask', kEditingId).then(r => {
      if (r.success) { toast('Task deleted', 'success'); closeKanbanModal(); loadKanban(); }
      else toast(r.message || 'Failed', 'error');
    }).catch(e => toast(String(e), 'error'));
  }

  function kQuickDelete(id) {
    if (!confirm('Delete this task?')) return;
    rpc('deleteKanbanTask', id).then(r => {

      else toast(r.message || 'Failed', 'error');
    }).catch(e => toast(String(e), 'error'));
  }

  let kCommentTaskId = null;

  function openCommentModal(id) {
    kCommentTaskId = id;
    const t = KSTATE.allTasks.find(x => x.id === id);
    if (!t) return;

    document.getElementById('kCommentTitle').textContent = 'Comments: ' + (t.title || id);
    document.getElementById('kCommentText').value = '';

    const listEl = document.getElementById('kCommentList');
    const comments = t.comments || [];

    if (!comments.length) {
      listEl.innerHTML = '<div class="empty" style="padding:20px;">No comments yet.</div>';
    } else {
      listEl.innerHTML = comments.map(c => {
        const date = c.at ? new Date(c.at).toLocaleString() : '';
        return '<div class="kcomment-item">' +
          '<div class="kcomment-header">' +
          '<strong>' + escapeHtml(c.by || 'Unknown') + '</strong>' +
          '<span class="kcomment-date">' + escapeHtml(date) + '</span>' +
          '</div>' +
          '<div class="kcomment-text">' + escapeHtml(c.text) + '</div>' +
          '</div>';
      }).join('');

      listEl.scrollTop = listEl.scrollHeight;
    }

    document.getElementById('kCommentModal').style.display = 'flex';

  function closeCommentModal() {
    document.getElementById('kCommentModal').style.display = 'none';
    kCommentTaskId = null;
  }

  function addKanbanComment() {
    const text = document.getElementById('kCommentText').value.trim();
    if (!text) { toast('Write a comment first', 'error'); return; }
    if (!kCommentTaskId) return;

    rpc('addTaskComment', kCommentTaskId, text).then(r => {
      if (r.success) {
        // Optimistic: add to local state
        const t = KSTATE.allTasks.find(x => x.id === kCommentTaskId);
        if (t) {
          if (!t.comments) t.comments = [];
          t.comments.push({
            by: (STATE.user && STATE.user.name) || 'You',
            text: text,
            at: new Date().toISOString()
          });
        }
        toast('Comment added', 'success');
        openCommentModal(kCommentTaskId); // re-render
        renderKanban(); // update comment count on card
      } else {
        toast(r.message || 'Failed', 'error');
      }
    }).catch(e => toast(String(e), 'error'));
  }

    const frequency = document.getElementById('rFrequency').value;

  function openUserModal(email) {

      document.getElementById('uName').value = '';
      document.getElementById('uRole').value = 'Teammate';

      document.getElementById('uPassword').value = '';

  function saveUser() {
    const email = document.getElementById('uEmail').value.trim().toLowerCase();
    const name = document.getElementById('uName').value.trim();
    const role = document.getElementById('uRole').value;
    const dept = document.getElementById('uDept').value.trim();
    const active = document.getElementById('uActive').checked;
    const pwd = document.getElementById('uPassword').value;
    const commodities = document.getElementById('uCommodities').value.trim();
    const backupOf = document.getElementById('uBackupOf').value.trim().toLowerCase();

    if (!email) { toast('Email required', 'error'); return; }

    const fn = ASTATE.editEmail ? 'updateUser' : 'addUser';
    const args = ASTATE.editEmail
      ? [email, name, role, dept, active, pwd, commodities, backupOf]
      : [email, name, role, dept, pwd, commodities, backupOf];
    rpc(fn, ...args).then(r => {
      if (r.success) { toast('User saved', 'success'); closeUserModal(); loadUsers(); }
      else toast(r.message || 'Failed', 'error');
    }).catch(e => toast(String(e), 'error'));
  }

      if (r.success) { toast('Removed', 'success'); loadUsers(); }
      else toast(r.message || 'Failed', 'error');
    }).catch(e => toast(String(e), 'error'));
  }

  function saveSettings_client() {
    const payload = {
      windowStart: document.getElementById('setStart').value,
      windowEnd: document.getElementById('setEnd').value,
      escalateDays: parseInt(document.getElementById('setEsc').value, 10) || 3,
      requireRemarks: document.getElementById('setRem').checked
    };
    if (document.getElementById('setMgr')) payload.managerEmail = document.getElementById('setMgr').value;
    if (document.getElementById('setLock')) payload.lockDuplicate = document.getElementById('setLock').checked;
    if (document.getElementById('setSlack')) payload.slackWebhookUrl = document.getElementById('setSlack').value;
    if (document.getElementById('setChat')) payload.chatWebhookUrl = document.getElementById('setChat').value;
    if (document.getElementById('setSuperEmail')) payload.superAdminEmail = document.getElementById('setSuperEmail').value;
    if (document.getElementById('setSuperEsc')) payload.superEscalateDays = parseInt(document.getElementById('setSuperEsc').value, 10) || 2;
    if (document.getElementById('setBackup')) payload.backupFolderId = document.getElementById('setBackup').value;
    if (document.getElementById('setApiKey')) payload.webhookApiKey = document.getElementById('setApiKey').value;

    document.getElementById('setMsg').textContent = 'Saving…';
    rpc('saveSettings', payload).then(r => {
      document.getElementById('setMsg').textContent = '';
      if (r.success) toast('Settings saved', 'success');
      else toast(r.message || 'Failed', 'error');
    }).catch(e => { document.getElementById('setMsg').textContent = ''; toast(String(e), 'error'); });
  }

  function togglePrefillLastEntry_client() {
    const btn = document.getElementById('prefillToggleBtn');
    const msg = document.getElementById('prefillMsg');
    if (!btn) return;
    const currentlyOn = btn.textContent === 'ON';
    const newVal = !currentlyOn;
    btn.disabled = true;
    msg.textContent = 'Saving…';
    rpc('togglePrefillLastEntry', newVal).then(r => {
      btn.disabled = false;
      msg.textContent = '';
      if (r.success) {
        btn.textContent = newVal ? 'ON' : 'OFF';
        btn.style.background = newVal ? '#22c55e' : '#475569';
        toast('Pre-fill Last Entry ' + (newVal ? 'enabled' : 'disabled'), 'success');
      } else {
        toast(r.message || 'Failed', 'error');
      }
    }).catch(e => { btn.disabled = false; msg.textContent = ''; toast(String(e), 'error'); });
  }
